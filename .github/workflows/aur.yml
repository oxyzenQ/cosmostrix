# Triggers after a successful GitHub Release publication and synchronizes
# pkgver, _tag, and .SRCINFO to the Arch User Repository.
#
# Design goals:
#   - Deterministic:  same tag always produces identical AUR state
#   - Idempotent:     re-running for the same tag is safe
#   - Retry-safe:     transient SSH failures can be retried
#   - Minimal:        only modifies pkgver, _tag, .SRCINFO
#
# SSH deployment policy:
#   Uses AUR_SSH_PRIVATE_KEY + AUR_SSH_PASSPHRASE from GitHub Actions
#   Secrets. The key is a dedicated, isolated, revocable ed25519 deploy
#   key (KDF rounds -a 200) protected by its own passphrase (NOT the GPG
#   passphrase — blast-radius isolation). The passphrase is fed to
#   ssh-agent via a step-scoped SSH_ASKPASS helper and never lands on
#   disk; the agent runs on a fixed socket so later steps can use the
#   decrypted key without re-prompting.

name: "Cosmic Dragon Guard - AUR Sync"

'on':
  # repository_dispatch: backward compat for old release.yml that uses
  # this trigger. Keep until all tagged releases use the new
  # workflow_dispatch trigger from release.yml.
  repository_dispatch:
    types: [aur-sync]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v2.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-sync-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

env:
  AUR_REPO: "ssh://aur@aur.archlinux.org/cosmostrix-bin.git"
  AUR_BRANCH: "master"
  PKGBUILD_DIR: "aur/cosmostrix-bin"
  # AUR commit identity — the Arch User Repository packager identity
  # (distinct from the GitHub bot identity in maintenance.yml).
  # Centralized at the top for easy maintenance (owner request 2026-08-23;
  # previously hardcoded inline in the push step).
  AUR_GIT_NAME: "rezky_nightky"
  AUR_GIT_EMAIL: "rezky2399@proton.me"
  # Opt into Node.js 24 for GitHub Actions (Node 20 deprecated June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-aur:
    name: "Cosmic Dragon Guard — Sync to AUR"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------
      # 1. Resolve the release tag
      # ------------------------------------------------------------------
      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          if [[ -z "${TAG}" ]]; then
            echo "::error::No tag provided via repository_dispatch or workflow_dispatch"
            exit 1
          fi

          # Ensure tag starts with 'v'
          TAG="${TAG## }"
          TAG="${TAG%% }"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi

          # Reject old -stable.N format
          if [[ "${TAG}" =~ -stable\. ]]; then
            echo "::error::Old -stable.N format is no longer supported: ${TAG}"
            echo "Use format: vX.Y.Z for stable releases, e.g. v2.1.0"
            exit 1
          fi

          # Reject pre-release tags — AUR only accepts stable packages.
          # Pre-release/alpha/rc/beta tags should NOT trigger this workflow.
          # This guard is belt-and-suspenders: release.yml already conditions
          # the AUR trigger on stable-only, but a manual workflow_dispatch
          # or stale repository_dispatch could slip through.
          if [[ "${TAG}" =~ -[a-zA-Z]+\.[0-9]+$ ]]; then
            echo "::error::Pre-release tags are not allowed for AUR sync: ${TAG}"
            echo "AUR only accepts stable packages. Use vX.Y.Z format (e.g. v25.0.0)"
            exit 1
          fi

          # Validate tag format: vX.Y.Z (stable only, pre-release already rejected)
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${TAG}' does not match required stable format vX.Y.Z"
            echo "Pre-release tags (vX.Y.Z-alpha.N etc.) are rejected by AUR policy"
            exit 1
          fi

          VERSION="${TAG#v}"

          # For stable tags (e.g. v2.1.0): pkgver=2.1.0, _tag (empty, not used)
          # For pre-release tags (e.g. v2.2.0-beta.1): pkgver=2.2.0, _tag=beta.1
          PKGVER="${VERSION%%-*}"
          if [[ "${VERSION}" == *-* ]]; then
            AUR_TAG="${VERSION#*-}"
          else
            AUR_TAG=""
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "pkgver=${PKGVER}"
            echo "aur_tag=${AUR_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: tag=${TAG} version=${VERSION} pkgver=${PKGVER} _tag=${AUR_TAG}"

      # ------------------------------------------------------------------
      # 2. Checkout the main repository (for PKGBUILD template)
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 3. Update PKGBUILD (only pkgver and _tag — mutation policy)
      # ------------------------------------------------------------------
      - name: Update PKGBUILD
        id: update
        shell: bash
        run: |
          set -euo pipefail

          PKGVER="${{ steps.resolve.outputs.pkgver }}"
          AUR_TAG="${{ steps.resolve.outputs.aur_tag }}"
          PKGBUILD="${{ env.PKGBUILD_DIR }}/PKGBUILD"

          if [[ ! -f "${PKGBUILD}" ]]; then
            echo "::error::PKGBUILD not found at ${PKGBUILD}"
            exit 1
          fi

          # Update pkgver (e.g. 2.1.0)
          sed -i -E "s|^pkgver=.*|pkgver=${PKGVER}|" "${PKGBUILD}"

          # Update _tag (empty for stable, channel suffix for pre-release)
          sed -i -E "s|^_tag=.*|_tag=${AUR_TAG}|" "${PKGBUILD}"

          # Reset pkgrel to 1 on version change
          sed -i -E "s|^pkgrel=.*|pkgrel=1|" "${PKGBUILD}"

          # Verify the updates
          echo "--- Updated PKGBUILD fields ---"
          grep -E '^(pkgver=|_tag=|pkgrel=)' "${PKGBUILD}"

      # ------------------------------------------------------------------
      # 4. Regenerate .SRCINFO from PKGBUILD
      # ------------------------------------------------------------------
      # .SRCINFO reflects the PKGBUILD state.  Since source=() and sha512sums=()
      # are empty (assets are downloaded dynamically in prepare()), the .SRCINFO
      # only contains metadata fields.  This is deterministic and idempotent.
      # ------------------------------------------------------------------
      - name: Regenerate .SRCINFO
        shell: bash
        run: |
          set -euo pipefail

          PKGVER="${{ steps.resolve.outputs.pkgver }}"
          PKGBUILD="${{ env.PKGBUILD_DIR }}/PKGBUILD"
          SRCINFO="${{ env.PKGBUILD_DIR }}/.SRCINFO"

          # Read current values from PKGBUILD. Sourcing defines variables and
          # functions only; prepare()/package() are not executed here.
          # shellcheck disable=SC1090
          source "${PKGBUILD}"

          if [[ -z "${pkgdesc}" ]]; then
            echo "::error::pkgdesc is empty or missing in ${PKGBUILD}"
            exit 1
          fi

          print_values() {
            local key="$1"
            shift
            local value
            for value in "$@"; do
              printf '\t%s = %s\n' "${key}" "${value}"
            done
          }

          # Generate .SRCINFO deterministically
          # .SRCINFO uses tab indentation for continuation lines
          # source=() and sha512sums=() are intentionally empty — assets are
          # selected and verified dynamically in prepare().
          {
            echo "pkgbase = cosmostrix-bin"
            printf '\tpkgdesc = %s\n' "${pkgdesc}"
            printf '\tpkgver = %s\n' "${pkgver}"
            printf '\tpkgrel = %s\n' "${pkgrel}"
            printf '\turl = %s\n' "${url}"
            print_values "arch" "${arch[@]}"
            print_values "license" "${license[@]}"
            print_values "depends" "${depends[@]}"
            print_values "provides" "${provides[@]}"
            print_values "conflicts" "${conflicts[@]}"
            print_values "options" "${options[@]}"
            echo ""
            echo "pkgname = cosmostrix-bin"
          } > "${SRCINFO}"

          generated_pkgver="$(grep -E '^[[:space:]]*pkgver = ' "${SRCINFO}" | sed -E 's/^[[:space:]]*pkgver = //')"
          if [[ "${generated_pkgver}" != "${PKGVER}" ]]; then
            echo "::error::.SRCINFO pkgver mismatch: expected ${PKGVER}, got ${generated_pkgver}"
            exit 1
          fi

          echo "--- Generated .SRCINFO ---"
          cat "${SRCINFO}"

      # ------------------------------------------------------------------
      # 5. Setup SSH for AUR deployment
      # ------------------------------------------------------------------
      - name: Setup SSH key
        shell: bash
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_PASSPHRASE: ${{ secrets.AUR_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${AUR_SSH_KEY}" ]]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          if [[ -z "${AUR_SSH_PASSPHRASE}" ]]; then
            echo "::error::AUR_SSH_PASSPHRASE secret is not configured"
            exit 1
          fi

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          # Write the private key (passphrase-protected ed25519, KDF -a 200)
          echo "${AUR_SSH_KEY}" > "${HOME}/.ssh/aur_key"
          chmod 600 "${HOME}/.ssh/aur_key"

          # Configure SSH to use the AUR deploy key.
          # BatchMode yes: fail fast instead of hanging if any prompt
          # would ever be needed — the decrypted key is provided by
          # ssh-agent (below), so no interactive input is required.
          cat > "${HOME}/.ssh/config" <<SSHEOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentitiesOnly yes
            BatchMode yes
          SSHEOF
          chmod 600 "${HOME}/.ssh/config"

          # Add AUR host key (deterministic, pinned)
          # Updated 2026-05: AUR rotated their Ed25519 host key (OpenSSH 10.3)
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" \
            > "${HOME}/.ssh/known_hosts"

          # Start ssh-agent on a FIXED socket and export it via
          # $GITHUB_ENV so the later "Push to AUR" step can reach the
          # agent. (The usual `eval "$(ssh-agent -s)"` pattern does NOT
          # work here: env vars from eval only live inside the current
          # step, while each GitHub Actions step is a fresh shell.)
          SSH_AGENT_SOCK="/tmp/aur-ssh-agent.sock"
          rm -f "${SSH_AGENT_SOCK}"
          ssh-agent -a "${SSH_AGENT_SOCK}" > /dev/null
          export SSH_AUTH_SOCK="${SSH_AGENT_SOCK}"
          echo "SSH_AUTH_SOCK=${SSH_AGENT_SOCK}" >> "${GITHUB_ENV}"

          # Load the key into the agent. The passphrase is provided via
          # a temporary SSH_ASKPASS helper that reads it from this step's
          # environment — the passphrase itself never lands on disk.
          # SSH_ASKPASS_REQUIRE=force needs OpenSSH >= 8.4 (runners have
          # 9.x). If the key were ever replaced by one without a
          # passphrase, ssh-add simply skips the askpass — still works.
          # The helper is generated via printf because a heredoc inside
          # a YAML literal block cannot place the shebang at column 0
          # (YAML would terminate the block) — and an indented "#!/bin/sh"
          # makes the file invalid for execve.
          ASKPASS="${HOME}/.ssh/aur_askpass"
          printf '#!/bin/sh\nprintf "%%s\\n" "$AUR_SSH_PASSPHRASE"\n' > "${ASKPASS}"
          chmod 700 "${ASKPASS}"
          SSH_ASKPASS="${ASKPASS}" SSH_ASKPASS_REQUIRE=force \
            ssh-add "${HOME}/.ssh/aur_key"
          rm -f "${ASKPASS}"

          # Fail fast with a clear signal if the key did not load
          # (wrong passphrase or corrupted secret).
          ssh-add -l > /dev/null

      # ------------------------------------------------------------------
      # 6. Clone AUR repository, apply changes, push
      # ------------------------------------------------------------------
      - name: Push to AUR
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.resolve.outputs.tag }}"

          # Clone the existing AUR package repository
          AUR_DIR="$(mktemp -d)"
          git clone --branch "${{ env.AUR_BRANCH }}" "${{ env.AUR_REPO }}" "${AUR_DIR}"

          # Copy updated files from our repo into the AUR clone
          cp -f "${{ env.PKGBUILD_DIR }}/PKGBUILD" "${AUR_DIR}/PKGBUILD"
          cp -f "${{ env.PKGBUILD_DIR }}/.SRCINFO" "${AUR_DIR}/.SRCINFO"

          # Verify no unintended files
          echo "--- AUR repo contents after copy ---"
          ls -la "${AUR_DIR}/"

          # Check for changes (idempotency — skip if already up to date)
          cd "${AUR_DIR}"
          if git diff --quiet; then
            echo "No changes to push — AUR is already up to date for ${TAG}"
            exit 0
          fi

          # Commit and push — use AUR identity from the env block, NOT the
          # GitHub identity (this pushes to the external Arch repository).
          git config user.name "${AUR_GIT_NAME}"
          git config user.email "${AUR_GIT_EMAIL}"

          git add PKGBUILD .SRCINFO
          git commit -m "chore: update to ${TAG}"

          # Push with retry (transient SSH failures)
          MAX_RETRIES=3
          RETRY_DELAY=10
          for i in $(seq 1 "${MAX_RETRIES}"); do
            if git push origin "${{ env.AUR_BRANCH }}"; then
              echo "Successfully pushed to AUR"
              break
            fi

            if [[ "${i}" -eq "${MAX_RETRIES}" ]]; then
              echo "::error::Failed to push to AUR after ${MAX_RETRIES} attempts"
              exit 1
            fi

            echo "Push attempt ${i} failed, retrying in ${RETRY_DELAY}s..."
            sleep "${RETRY_DELAY}"
          done

          echo "AUR package updated to ${TAG}"

      # ------------------------------------------------------------------
      # 7. Cleanup
      # ------------------------------------------------------------------
      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          # Kill the ssh-agent started by the setup step (socket path is
          # exported to this step via $GITHUB_ENV), then remove all SSH
          # artifacts including the askpass helper leftover from a failed
          # setup. Cleanup must never fail the job.
          if [[ -S "${SSH_AUTH_SOCK:-}" ]]; then
            ssh-agent -k > /dev/null 2>&1 || true
          fi
          pkill -u "$(id -u)" -x ssh-agent > /dev/null 2>&1 || true
          rm -rf "${HOME}/.ssh/aur_key" "${HOME}/.ssh/config" \
                 "${HOME}/.ssh/known_hosts" "${HOME}/.ssh/aur_askpass"
