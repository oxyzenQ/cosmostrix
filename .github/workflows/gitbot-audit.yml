# Schedule: Daily at 00:00 UTC
#
# Purpose:
# - Fast, non-mutating security scan
# - Early CVE warning without touching Cargo.lock
# - Minimal CI resource consumption
#
# This workflow does NOT modify any repository files.
# For dependency update reports, see: maintenance.yml (weekly)

name: "Cosmic Dragon Guard - Security Audit"

'on':
  schedule:
    - cron: "0 0 * * *"  # 00:00 UTC daily
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
  workflow_dispatch:
    inputs:
      run_deny:
        description: "Also run cargo-deny policy check"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  # Opt into Node.js 24 for GitHub Actions (Node 20 deprecated June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # Single source of truth for Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version.
  RUST_VERSION: "1.97.1"

jobs:
  security-audit:
    name: "Cosmic Dragon Guard - Security Audit Run"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run security audit
        id: audit
        run: |
          echo "Running security audit..."

          if cargo audit 2>&1; then
            echo "No known vulnerabilities found"
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "Vulnerabilities detected — review advisories above"
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cargo-deny (on-demand)
        id: deny
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_deny == 'true' }}
        run: |
          echo "Running dependency policy check (cargo-deny)..."
          cargo deny check all

      - name: Summary
        run: |
          echo "Security audit summary"
          echo "  Status: ${{ steps.audit.outputs.status }}"
          echo "  Trigger: ${{ github.event_name }}"
          echo "Observation-only — no files modified. Dependency updates: maintenance.yml (weekly)."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
