name: "Cosmic Dragon Guard - Release"

'on':
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

env:
  # Opt into Node.js 24 for GitHub Actions (Node 20 deprecated June 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Single source of truth for Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version.
  RUST_VERSION: "1.98.1"

jobs:
  # NIGHT-improve-1: the commit+tag collision gate. When the release
  # commit and its tag are pushed together (git push origin main
  # vX.Y.Z), this workflow used to start building while the branch CI
  # (ci.yml) was still running the same SHA — the release shipped
  # before CI could pass judgment, and the parallel crates-io.yml
  # publish (irreversible) shipped with it. Every build job below now
  # needs this gate: it waits for the ci.yml push-run on the exact
  # tagged SHA and requires conclusion=success (a SHA whose ci.yml
  # run never appears passes after a grace period; a cancelled
  # or failed CI blocks the release with a recovery hint). Full
  # contract: scripts/ci/wait-for-ci.sh. docs/workflow/ABOUT_CI.md
  # documents the serialized release flow.
  ci_gate:
    name: Cosmic Dragon - CI gate (commit+tag push)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      # Job-level override. The wait itself only needs run listings +
      # the checkout (actions: read / contents: read); the NIGHT-dinner-1
      # infra carve-out additionally requests re-runs of infra-
      # signatured failed runs (actions: write — the job's ephemeral
      # github.token can re-run this repo's CI and nothing else). The
      # workflow-level contents:write/actions:write grants stay scoped
      # to the jobs that need them.
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ci-gate tools (every seat installs its own)
        shell: bash
        run: |
          set -euo pipefail
          # night-dragon-maintenance-7 (zelynic night-dragon-maintenance-10
          # lineage): this job runs wait-for-ci.sh OUTSIDE the wholesale
          # cosmic-dragon-guard seat - the exact geometry that killed
          # zelynic v80.0.1-night.1, where one publish lane trusted the
          # runner image's apt set and died in fourteen seconds on the
          # first tag that stepped on the gap. curl and jq are runner
          # staples today; the law is that this seat installs what it
          # runs instead of trusting the image. wait-for-ci.sh fail-closes
          # on a missing tool, so this census pays the seat's own bill
          # before the gate asks for it.
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=5 update -qq
            sudo apt-get -o Acquire::Retries=5 install -y -qq jq
          fi
          jq --version

      - name: Wait for the branch CI on the tagged commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait-for-ci.sh

  build_packages:
    name: Cosmic Dragon - Build packages (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: ci_gate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # night-dragon-maintenance-6 (the sibling's night-badass-1 law):
          # the Linux x86_64 matrix is the fully static musl pair. The gnu
          # legs are retired - no glibc-linked release package ships. The
          # v3-musl leg carries the full gate (fmt, clippy, tests, audit,
          # deny) like the old gnu v3 leg did; the v4-musl leg is the
          # AVX-512 supercharger shape.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-amd64-v3-musl
            profile: pro-linux-amd64-v3-musl
            rustflags: "-C target-cpu=x86-64-v3"
            # night-dragon-maintenance-T1: the release label is the alias
            # name verbatim (the estate "every build shape starts with
            # pro-" law) — a downloaded release binary reports
            # "Build: pro-linux-amd64-v3-musl"; local alias builds stamp
            # the same name under the `local-` marker instead.
            build: pro-linux-amd64-v3-musl
            checks: true
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-amd64-v4-musl
            profile: pro-linux-amd64-v4-musl
            rustflags: "-C target-cpu=x86-64-v4"
            build: pro-linux-amd64-v4-musl
            checks: false
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64-native
            profile: pro-macos-aarch64
            rustflags: "-C target-cpu=native"
            build: pro-macos-aarch64
            checks: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            profile: pro-win-amd64
            rustflags: "-C target-cpu=x86-64"
            build: pro-win-amd64
            checks: false
          # Windows ARM64 (Snapdragon X / Copilot+ PCs): native build on the
          # windows-11-arm hosted runner. Verified compile-clean on 2026-08-23
          # (docs/archive/research/PLATFORM_EXPANSION_IOS_WIN_ARM64.md) — every
          # platform fork is cfg(unix)/cfg(target_os)-keyed, never arch-keyed.
          # target-cpu=native is safe here: the runner is real ARM64 hardware
          # (same policy as the darwin-aarch64 entry).
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            profile: pro-win-aarch64
            rustflags: "-C target-cpu=native"
            build: pro-win-aarch64
            checks: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Reject old format like v2.1.0-stable.1
          if [[ "${TAG}" =~ -stable\. ]]; then
            echo "::error::Old tag format detected: ${TAG}"
            echo "Stable releases no longer use -stable.N suffixes."
            echo "Use format: vX.Y.Z, example: v2.1.0"
            exit 1
          fi
          # Strict shape: vX.Y.Z (stable) or vX.Y.Z-<suffix> (pre-release).
          # One classification law (night-dragon-maintenance-3): the FIRST
          # hyphen after the version makes the tag a pre-release - no
          # channel enumeration, any suffix is legal (owner law, zejtron
          # release.yml lineage). The publish job classifies with the
          # same rule; AUR rejects every suffixed tag.
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            echo "Expected format: vX.Y.Z (stable) or vX.Y.Z-<suffix> (pre-release)"
            echo "Examples: v2.1.0, v2.2.0-beta.1, v2.2.0-example.1"
            exit 1
          fi
          echo "Tag validation passed: ${TAG}"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          TAG="${TAG## }"
          TAG="${TAG%% }"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi

          VERSION="${TAG#v}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Set cargo build jobs (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(nproc 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS=2
          fi
          echo "CARGO_BUILD_JOBS=${JOBS}" >> "$GITHUB_ENV"

      - name: Set cargo build jobs (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jobs = $env:NUMBER_OF_PROCESSORS
          if (-not $jobs) { $jobs = 2 }
          "CARGO_BUILD_JOBS=$jobs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl cross-compiler (musl builds only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          # NIGHT-dinner-1: apt rides its own retry knob — a flaky
          # mirror fetch must not read as a code failure.
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y musl-tools

      - name: Verify Linux x86_64 CPU baseline inputs
        if: startsWith(matrix.platform, 'linux-amd64-v')
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux-amd64-v3-musl) expected="-C target-cpu=x86-64-v3" ;;
            linux-amd64-v4-musl) expected="-C target-cpu=x86-64-v4" ;;
            *) echo "::error::Unknown Linux x86_64 platform ${{ matrix.platform }}"; exit 1 ;;
          esac
          if [[ "${{ matrix.rustflags }}" != "${expected}" ]]; then
            echo "::error::${{ matrix.platform }} must use RUSTFLAGS='${expected}', got '${{ matrix.rustflags }}'"
            exit 1
          fi

      - name: Setup MSVC dev cmd (windows-amd64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSVC dev cmd (windows-aarch64)
        if: matrix.target == 'aarch64-pc-windows-msvc' && runner.arch == 'X64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install audit + deny tools
        if: matrix.checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit dependencies
        if: matrix.checks
        run: cargo audit

      - name: Tests
        if: matrix.checks
        run: cargo test --all --locked

      - name: Build (debug)
        if: matrix.checks && runner.os != 'Windows'
        run: cargo build --profile dev --locked --target ${{ matrix.target }} --jobs "${CARGO_BUILD_JOBS}"

      - name: Build (debug)
        if: matrix.checks && runner.os == 'Windows'
        shell: pwsh
        run: cargo build --profile dev --locked --target ${{ matrix.target }} --jobs "$env:CARGO_BUILD_JOBS"

      - name: Build (release)
        if: runner.os != 'Windows'
        shell: bash
        env:
          COSMOSTRIX_BUILD: ${{ matrix.build }}
          COSMOSTRIX_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          # Hardened RUSTFLAGS: remap cargo + project paths out of the
          # binary (supply-chain hygiene) and keep frame pointers for
          # post-mortem debugging without performance cost.
          export RUSTFLAGS="${{ matrix.rustflags }} --remap-path-prefix=$HOME/.cargo=redacted --remap-path-prefix=$PWD=redacted -C force-frame-pointers=yes"
          cargo build --profile ${{ matrix.profile }} --target ${{ matrix.target }} --jobs "${CARGO_BUILD_JOBS}"

      - name: Build (release)
        if: runner.os == 'Windows'
        env:
          COSMOSTRIX_BUILD: ${{ matrix.build }}
          COSMOSTRIX_PROFILE: ${{ matrix.profile }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        shell: pwsh
        run: cargo build --profile ${{ matrix.profile }} --target ${{ matrix.target }} --jobs "$env:CARGO_BUILD_JOBS"

      - name: Verify build metadata
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/${{ matrix.profile }}/cosmostrix"
          BUILD_ID="${{ matrix.build }}"
          case "${BUILD_ID}" in
            # NIGHT-blade-1: labels match the matrix build ids verbatim
            # (the pre-blade-1 labels dropped the -gnu/-musl suffix, so
            # the v3/v4 baseline verification silently never matched and
            # only the musl leg exercised this case).
            # night-dragon-maintenance-6: the gnu cases are retired with
            # their legs; the musl pair is the full matrix now.
            linux-amd64-v3-musl|pro-linux-amd64-v3-musl) BASELINE="x86-64-v3"; OPTIMIZATION="x86-64-v3 baseline (AVX/AVX2/BMI1/BMI2/FMA) + musl static"; REQUIRED="avx2 bmi2 fma"; DENIED="" ;;
            linux-amd64-v4-musl|pro-linux-amd64-v4-musl)
              BASELINE="x86-64-v4"; OPTIMIZATION="x86-64-v4 baseline (AVX-512) + musl static"
              REQUIRED="avx512f avx512bw avx512cd avx512dq avx512vl"; DENIED="" ;;
            *) BASELINE=""; OPTIMIZATION=""; REQUIRED=""; DENIED="" ;;
          esac

          # FreeBSD cross-compiled binary cannot run on Linux; verify via strings.
          # Similarly, v4 may SIGILL on runners without AVX-512.
          if [[ "${BUILD_ID}" == freebsd-* ]] || [[ "${BUILD_ID}" == *v4* ]]; then
            echo "Skipping execution for ${BUILD_ID} (cross-compiled); verifying embedded build metadata in binary"
            if command -v strings >/dev/null 2>&1; then
              TEXT="$(strings "${BIN}")"
            else
              TEXT="$(grep -aE "${BUILD_ID}|static optimized build|fat|unwind|yes" "${BIN}" || true)"
            fi
            grep -Fq "${BUILD_ID}" <<<"${TEXT}" || { echo "::error::Expected embedded variant ${BUILD_ID}"; exit 1; }
            grep -Fq "static optimized build" <<<"${TEXT}" || { echo "::error::Expected embedded dispatch metadata"; exit 1; }
            grep -Fq "fat" <<<"${TEXT}" || { echo "::error::Expected embedded lto metadata fat"; exit 1; }
            grep -Fq "unwind" <<<"${TEXT}" || { echo "::error::Expected embedded panic metadata unwind"; exit 1; }
            grep -Fq "yes" <<<"${TEXT}" || { echo "::error::Expected embedded strip metadata yes"; exit 1; }
          else
            OUT="$(${BIN} --doctor)"
            echo "${OUT}"
            # night-dragon-maintenance-8: doctor fields ride the
            # aligned-column canon (maintenance-1) - the grep tolerates
            # the padded gap between the key and the value.
            grep -E "^  build: +${BUILD_ID}$" <<<"${OUT}" || { echo "::error::Expected build ${BUILD_ID}"; exit 1; }
            if [[ -n "${OPTIMIZATION}" ]]; then
              grep -F "  optimization: " <<<"${OUT}" | grep -Fq "${OPTIMIZATION}" || { echo "::error::Expected optimization: ${OPTIMIZATION}"; exit 1; }
            fi
            grep -E "^  dispatch: +static optimized build$" <<<"${OUT}" || { echo "::error::Expected dispatch: static optimized build"; exit 1; }
            if [[ -n "${BASELINE}" ]]; then
              grep -E "^  cpu_baseline: +${BASELINE}$" <<<"${OUT}" || { echo "::error::Expected cpu_baseline: ${BASELINE}"; exit 1; }
              for feature in ${REQUIRED}; do
                grep -F "  target_features:" <<<"${OUT}" | grep -Fq "${feature}" || { echo "::error::Expected target feature ${feature}"; exit 1; }
              done
              for feature in ${DENIED}; do
                if grep -F "  target_features:" <<<"${OUT}" | grep -Fq "${feature}"; then
                  echo "::error::Unexpected target feature ${feature} for ${BUILD_ID}"
                  exit 1
                fi
              done
            fi
            grep -E "^  lto: +fat$" <<<"${OUT}" || { echo "::error::Expected lto: fat"; exit 1; }
            grep -E "^  panic: +unwind$" <<<"${OUT}" || { echo "::error::Expected panic: unwind"; exit 1; }
            grep -E "^  strip: +yes$" <<<"${OUT}" || { echo "::error::Expected strip: yes"; exit 1; }
          fi

      - name: Verify build metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/${{ matrix.target }}/${{ matrix.profile }}/cosmostrix.exe"
          $build = "${{ matrix.build }}"

          if ($build.EndsWith("-v4")) {
            Write-Host "Skipping execution for $build (may require AVX-512); verifying embedded build metadata in binary"
            $bytes = [System.IO.File]::ReadAllBytes($bin)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if (-not $text.Contains($build)) {
              throw "Expected embedded build id '$build' in binary"
            }
            foreach ($needle in @("static optimized build", "fat", "unwind", "yes")) {
              if (-not $text.Contains($needle)) {
                throw "Expected embedded metadata '$needle' in binary"
              }
            }
          } else {
            $outLines = & $bin --doctor
            $out = ($outLines | ForEach-Object { $_.TrimEnd("`r") }) -join "`n"
            $out
            # v17: --doctor has 'build:' field in SYSTEM section
            # night-dragon-maintenance-8: the aligned-column canon pads the
            # key to the section column - \s+ tolerates the padded gap.
            $pat = "(?m)^  build:\s+" + [regex]::Escape($build) + "\s*$"
            if ($out -notmatch $pat) {
              throw "Expected build '$build' in cosmostrix --doctor output"
            }
            foreach ($pat in @(
              "(?m)^  dispatch:\s+static optimized build\s*$",
              "(?m)^  lto:\s+fat\s*$",
              "(?m)^  panic:\s+unwind\s*$",
              "(?m)^  strip:\s+yes\s*$"
            )) {
              if ($out -notmatch $pat) {
                throw "Expected metadata pattern '$pat' in cosmostrix --doctor output"
              }
            }
          }

      - name: Format check
        if: matrix.checks
        run: cargo fmt --all -- --check

      - name: Dependency policy (cargo-deny)
        if: matrix.checks
        run: cargo deny check all

      - name: Clippy
        if: matrix.checks
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Verify binary is stripped
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/${{ matrix.profile }}/cosmostrix"
          if file "${BIN}" | grep -qiE 'not stripped'; then
            echo "::error::Metadata says strip: yes, but file reports not stripped: ${BIN}"
            exit 1
          fi
          echo "Binary stripped: $(file "${BIN}" | head -1)"

      - name: Package (.tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"

          TARGET="${{ matrix.target }}"
          PLATFORM="${{ matrix.platform }}"

          PROFILE="${{ matrix.profile }}"

          # Flat archive layout: files at archive root
          # Archive contains: /cosmostrix, /LICENSE, /README.md
          # PKGBUILD depends on this invariant — do NOT add nesting.
          OUTDIR="dist/stage"
          mkdir -p "$OUTDIR"
          cp -f "target/${TARGET}/${PROFILE}/cosmostrix" "$OUTDIR/"
          cp -f "README.md" "$OUTDIR/"
          cp -f "LICENSE" "$OUTDIR/"

          TARBALL="cosmostrix-${TAG}-${PLATFORM}.tar.gz"
          tar -czf "dist/${TARBALL}" -C "$OUTDIR" cosmostrix LICENSE README.md

          (
            cd dist
            if command -v sha512sum >/dev/null 2>&1; then
              sha512sum "${TARBALL}" > "${TARBALL}.sha512sum"
            else
              shasum -a 512 "${TARBALL}" > "${TARBALL}.sha512sum"
            fi
            # Quantum-resistant checksums: BLAKE3-256 + SHAKE256
            # (night-dragon-maintenance-0: the BLAKE2b-512 sidecar is
            # upgraded to BLAKE3, matching the sibling's prebuilt-lane
            # digest algorithm). b3sum is not in GNU coreutils and not
            # preinstalled on runners; the official BLAKE3 CLI comes
            # from crates.io (cargo install, locked) when absent. If
            # both paths fail the sidecar is skipped honestly -
            # sha512sum (mandatory) and shake256 still cover integrity.
            if ! command -v b3sum >/dev/null 2>&1; then
              cargo install b3sum --locked --quiet || true
            fi
            if command -v b3sum >/dev/null 2>&1; then
              b3sum "${TARBALL}" > "${TARBALL}.b3sum"
            else
              echo "::warning::b3sum unavailable - ${TARBALL}.b3sum sidecar skipped (sha512sum + shake256 still generated)"
            fi
            # SHAKE256 via Python (cross-platform — macOS ships LibreSSL which
            # doesn't support -shake256, Windows ships LibreSSL too)
            _s=$(python3 -c "import hashlib;print(hashlib.shake_256(open(0,'rb').read()).hexdigest(64))" < "${TARBALL}")
            echo "${_s}  ${TARBALL}" > "${TARBALL}.shake256"
          )

          # Verify archive layout
          echo "--- Archive contents ---"
          tar -tzf "dist/${TARBALL}"
          echo "--- End archive contents ---"

      - name: Verify binary is stripped (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/${{ matrix.target }}/${{ matrix.profile }}/cosmostrix.exe"
          # Windows MSVC strip is handled by the linker; just verify the file exists
          if (-not (Test-Path $bin)) {
            throw "Binary not found: $bin"
          }
          $size = (Get-Item $bin).Length
          Write-Host "Binary size: $size bytes"

      - name: Package (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $TAG = "${{ steps.ver.outputs.tag }}"
          $VERSION = "${{ steps.ver.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $PLATFORM = "${{ matrix.platform }}"

          $PROFILE = "${{ matrix.profile }}"

          # Flat archive layout: files at archive root
          $outDir = "dist/stage"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Copy-Item -Force "target/$TARGET/$PROFILE/cosmostrix.exe" "$outDir/"
          Copy-Item -Force "README.md" "$outDir/"
          Copy-Item -Force "LICENSE" "$outDir/"

          $zip = "cosmostrix-$TAG-$PLATFORM.zip"
          if (Test-Path "dist/$zip") { Remove-Item -Force "dist/$zip" }
          Compress-Archive -Force -Path "$outDir/*" -DestinationPath "dist/$zip"

          $hash = (Get-FileHash -Algorithm SHA512 "dist/$zip").Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "dist/$zip.sha512sum"

          # BLAKE3 via b3sum (night-dragon-maintenance-0: replaces the
          # BLAKE2b-512 sidecar; matches the sibling's prebuilt-lane
          # digest algorithm). b3sum is not preinstalled on Windows;
          # the official BLAKE3 CLI comes from crates.io via cargo
          # (locked). Skipped honestly when both paths fail -
          # sha512sum remains the mandatory sidecar.
          if (-not (Get-Command b3sum -ErrorAction SilentlyContinue)) {
            try { cargo install b3sum --locked --quiet } catch {}
          }
          if (Get-Command b3sum -ErrorAction SilentlyContinue) {
            $b3Hash = (b3sum "dist/$zip").Split(' ')[0]
            "$b3Hash  $zip" | Out-File -Encoding ascii "dist/$zip.b3sum"
          } else {
            Write-Host "::warning::b3sum unavailable - $zip.b3sum sidecar skipped (sha512sum + shake256 still generated)"
          }

          # SHAKE256 via Python (Windows ships LibreSSL which doesn't support -shake256)
          $py = "import hashlib; d=open('dist/$zip','rb').read(); print(hashlib.shake_256(d).hexdigest(64))"
          try {
            $shakeHash = (python3 -c $py).Trim()
            if ($shakeHash) {
              "$shakeHash  $zip" | Out-File -Encoding ascii "dist/$zip.shake256"
            }
          } catch {
            # SHAKE256 generation failed — skip (sha512sum is still generated)
          }

      - name: Upload artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*.tar.gz*
          if-no-files-found: error

      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*.zip*
          if-no-files-found: error

  build_android:
    name: Cosmic Dragon - Build packages (android-aarch64-native)
    runs-on: ubuntu-24.04
    needs: ci_gate
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          TAG="${TAG## }"
          TAG="${TAG%% }"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ -z "${CARGO_VERSION}" ]]; then
            echo "::error::Could not extract version from Cargo.toml"
            exit 1
          fi
          if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "::error::Tag version ${TAG_VERSION} does not match Cargo.toml version ${CARGO_VERSION}"
            exit 1
          fi
          echo "Version check passed: tag ${TAG_VERSION} == Cargo.toml ${CARGO_VERSION}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Set cargo build jobs
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(nproc 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS=2
          fi
          echo "CARGO_BUILD_JOBS=${JOBS}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve latest stable Android NDK version
        id: ndkver
        shell: bash
        run: |
          set -euo pipefail
          # Owner policy: zero hardcoded dep versions. nttld/setup-ndk has
          # no "latest" support (it splices the value literally into the
          # download URL -> 404), so resolve the newest stable-final NDK
          # from Google's repository manifest at run time.
          echo "ndk=$(python3 scripts/ci/resolve-latest-ndk.py)" >> "$GITHUB_OUTPUT"

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.ndkver.outputs.ndk }}

      - name: Add Rust target
        run: rustup target add aarch64-linux-android

      - name: Build (release, android-aarch64)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          COSMOSTRIX_BUILD: pro-android-aarch64
          COSMOSTRIX_PROFILE: pro-android-aarch64
        run: |
          set -euo pipefail
          TARGET="aarch64-linux-android"

          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="${TOOLCHAIN}/bin/aarch64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC_aarch64_linux_android}"

          # Hardened RUSTFLAGS: remap cargo + project paths out of the
          # binary (supply-chain hygiene) and keep frame pointers for
          # post-mortem debugging without performance cost.
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=redacted --remap-path-prefix=$PWD=redacted -C force-frame-pointers=yes"
          cargo build --profile pro-android-aarch64 --target "${TARGET}" --jobs "${CARGO_BUILD_JOBS}"

      - name: Verify embedded build metadata
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/aarch64-linux-android/pro-android-aarch64/cosmostrix"
          BUILD_ID="pro-android-aarch64"
          echo "Verifying embedded build metadata in binary: ${BUILD_ID}"
          if command -v strings >/dev/null 2>&1; then
            TEXT="$(strings "${BIN}")"
          else
            TEXT="$(grep -aE 'pro-android-aarch64|static optimized build|fat|unwind|yes' "${BIN}" || true)"
          fi
          grep -Fq "${BUILD_ID}" <<<"${TEXT}" || { echo "::error::Expected embedded variant ${BUILD_ID}"; exit 1; }
          grep -Fq "static optimized build" <<<"${TEXT}" || { echo "::error::Expected embedded dispatch metadata"; exit 1; }
          grep -Fq "fat" <<<"${TEXT}" || { echo "::error::Expected embedded lto metadata fat"; exit 1; }
          grep -Fq "unwind" <<<"${TEXT}" || { echo "::error::Expected embedded panic metadata unwind"; exit 1; }
          grep -Fq "yes" <<<"${TEXT}" || { echo "::error::Expected embedded strip metadata yes"; exit 1; }

      - name: Package (.tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          TARGET="aarch64-linux-android"
          PLATFORM="android-aarch64-native"

          PROFILE="pro-android-aarch64"

          # Flat archive layout: files at archive root
          OUTDIR="dist/stage"
          mkdir -p "$OUTDIR"
          cp -f "target/${TARGET}/${PROFILE}/cosmostrix" "$OUTDIR/"
          cp -f "README.md" "$OUTDIR/"
          cp -f "LICENSE" "$OUTDIR/"

          TARBALL="cosmostrix-${TAG}-${PLATFORM}.tar.gz"
          tar -czf "dist/${TARBALL}" -C "$OUTDIR" cosmostrix LICENSE README.md

          (
            cd dist
            if command -v sha512sum >/dev/null 2>&1; then
              sha512sum "${TARBALL}" > "${TARBALL}.sha512sum"
            else
              shasum -a 512 "${TARBALL}" > "${TARBALL}.sha512sum"
            fi
            # Quantum-resistant checksums: BLAKE3-256 + SHAKE256
            # (night-dragon-maintenance-0: the BLAKE2b-512 sidecar is
            # upgraded to BLAKE3, matching the sibling's prebuilt-lane
            # digest algorithm). b3sum is not in GNU coreutils and not
            # preinstalled on runners; the official BLAKE3 CLI comes
            # from crates.io (cargo install, locked) when absent. If
            # both paths fail the sidecar is skipped honestly -
            # sha512sum (mandatory) and shake256 still cover integrity.
            if ! command -v b3sum >/dev/null 2>&1; then
              cargo install b3sum --locked --quiet || true
            fi
            if command -v b3sum >/dev/null 2>&1; then
              b3sum "${TARBALL}" > "${TARBALL}.b3sum"
            else
              echo "::warning::b3sum unavailable - ${TARBALL}.b3sum sidecar skipped (sha512sum + shake256 still generated)"
            fi
            # SHAKE256 via Python (cross-platform — macOS ships LibreSSL which
            # doesn't support -shake256, Windows ships LibreSSL too)
            _s=$(python3 -c "import hashlib;print(hashlib.shake_256(open(0,'rb').read()).hexdigest(64))" < "${TARBALL}")
            echo "${_s}  ${TARBALL}" > "${TARBALL}.shake256"
          )

          # Verify archive layout
          echo "--- Archive contents ---"
          tar -tzf "dist/${TARBALL}"
          echo "--- End archive contents ---"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-android-aarch64-native
          path: dist/*.tar.gz*
          if-no-files-found: error

  # night-dragon-maintenance-T1: the PGO nitro release packages
  # (cosmostrix-<tag>-linux-amd64-v3-musl-pgo.tar.gz and the v4 twin)
  # are retired from the shipped matrix - long stability over the PGO
  # performance edge. The nitro build remains a local capability only:
  # ./scripts/build.sh pgo (instrument -> benchmark -> optimize).

  build_freebsd:
    name: Cosmic Dragon - Build (freebsd native)
    runs-on: ubuntu-24.04
    needs: ci_gate
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build on FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: false
          mem: 4096
          prepare: |
            pkg install -y curl ca_root_nss python3
            # NIGHT-dinner-1: the rustup download rides the curl retry
            # contract (--retry-all-errors covers the exit-22 5xx class
            # plain --retry refuses to re-attempt).
            curl --proto '=https' --tlsv1.2 -sSf --retry 6 --retry-all-errors \
              --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
              https://sh.rustup.rs | sh -s -- -y --default-toolchain ${{ env.RUST_VERSION }}
            . "$HOME/.cargo/env"
            rustup component add clippy rustfmt
          run: |
            . "$HOME/.cargo/env"
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"

            # Build release binary (native FreeBSD, no cross-compile)
            COSMOSTRIX_BUILD=pro-freebsd-amd64 \
            COSMOSTRIX_PROFILE=pro-freebsd-amd64 \
            COSMOSTRIX_LTO=fat \
            COSMOSTRIX_STRIP=yes \
            cargo build --profile pro-freebsd-amd64 --locked --jobs "$(sysctl -n hw.ncpu)"

            # Verify via --doctor
            BIN="target/pro-freebsd-amd64/cosmostrix"
            OUT=$("${BIN}" --doctor) || { echo "::error::--doctor failed"; exit 1; }
            printf '%s\n' "${OUT}" | grep -Fq "COSMOSTRIX DIAGNOSTICS REPORT" || { echo "::error::Doctor report missing"; exit 1; }
            # night-dragon-maintenance-1: the doctor fields ride the
            # zelynic aligned-column canon (key padded to the section
            # column), so the value no longer sits one space after the
            # colon — the grep tolerates the padded gap.
            printf '%s\n' "${OUT}" | grep -E "^  build: +pro-freebsd-amd64$" || { echo "::error::Expected build pro-freebsd-amd64"; exit 1; }

            # Quick benchmark smoke test
            echo "=== Benchmark smoke test ===" && "${BIN}" --benchmark --bench-duration 1 --bench-frames 10 2>&1 | head -5 || true

            # Package
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            TARBALL="cosmostrix-v${VERSION}-freebsd-amd64.tar.gz"
            tar czf "${TARBALL}" -C target/pro-freebsd-amd64 cosmostrix
            sha512sum "${TARBALL}" > "${TARBALL}.sha512sum"
            # BLAKE3 via b3sum (night-dragon-maintenance-0: replaces the
            # BLAKE2b-512 sidecar; matches the sibling's prebuilt-lane
            # digest algorithm). FreeBSD doesn't ship b3sum in base;
            # the official BLAKE3 CLI comes from crates.io via cargo
            # (locked) - cargo is already provisioned by the prepare
            # step. Skipped honestly when both paths fail.
            if ! command -v b3sum >/dev/null 2>&1; then
              cargo install b3sum --locked --quiet || true
            fi
            if command -v b3sum >/dev/null 2>&1; then
              b3sum "${TARBALL}" > "${TARBALL}.b3sum"
            else
              echo "::warning::b3sum unavailable - ${TARBALL}.b3sum sidecar skipped (sha512sum + shake256 still generated)"
            fi
            # SHAKE256 via Python (cross-platform)
            python3 -c "import hashlib; print(hashlib.shake_256(open('${TARBALL}','rb').read()).hexdigest(64) + '  ${TARBALL}')" > "${TARBALL}.shake256"
            echo "FreeBSD build + package complete: ${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: packages-freebsd-amd64
          path: cosmostrix-*-freebsd-amd64.tar.gz*
          retention-days: 30

  publish_release:
    name: Cosmic Dragon - Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build_packages, build_android, build_freebsd]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          TAG="${TAG## }"
          TAG="${TAG%% }"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${TAG}"
          fi

          VERSION="${TAG#v}"
          PRE="false"
          # Single classification law (night-dragon-maintenance-3): a
          # hyphen in the version makes the tag a pre-release - no
          # channel enumeration (the old alpha/beta/rc/pre/nightly
          # case arms were dead weight: the catch-all already classified
          # every suffix as pre-release). Only the retired -stable.N
          # shape keeps its specific rejection.
          if [[ "${VERSION}" == *-* ]]; then
            SUFFIX="${VERSION#*-}"
            if [[ "${SUFFIX}" == stable.* ]]; then
              echo "::error::Old -stable.N format is no longer supported: ${TAG}"
              echo "Use format: vX.Y.Z for stable releases, e.g. v2.1.0"
              exit 1
            fi
            PRE="true"
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRE}"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY secret not configured — skipping GPG signing"
            exit 0
          fi
          # Import the armored private key. --batch + --yes prevents
          # interactive prompts. --pinentry-mode loopback allows
          # passwordless import for keys without passphrase protection.
          # If the key has a passphrase, pass it via --passphrase (stdin).
          # Do NOT redirect stderr to /dev/null — we need to see import
          # errors for debugging.
          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --import --batch --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              <(echo "${GPG_PRIVATE_KEY}")
          else
            echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes \
              --pinentry-mode loopback
          fi
          # Debug: show what was imported (key IDs only, no secrets)
          gpg --list-secret-keys --with-colons || true
          # Extract the key ID. Try ssb: (subkey, usage S) first, then
          # sec: (master key, usage SC). The awk field $12 is the key
          # capability flags — we check if it contains 'S' (signing).
          KEY_ID="$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^(ssb|sec):/ && $12 ~ /S/ {print $5; exit}')"
          if [ -z "${KEY_ID}" ]; then
            # Fallback: some gpg versions use field $12 differently.
            # Try matching by key usage in field 12 OR by the presence
            # of the 'sec'/'ssb' record (any secret key can sign).
            KEY_ID="$(gpg --list-secret-keys --with-colons \
              | awk -F: '/^(ssb|sec):/ {print $5; exit}')"
          fi
          if [ -z "${KEY_ID}" ]; then
            echo "::error::Failed to import GPG secret key (no signing-capable key found)"
            echo "::error::gpg --list-secret-keys output:"
            gpg --list-secret-keys 2>&1 || true
            exit 1
          fi
          echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE=${GPG_PASSPHRASE}" >> "$GITHUB_ENV"
          echo "Imported GPG signing key: ${KEY_ID}"

      - name: Sign artifacts (detached GPG signatures)
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Sign every .tar.gz and .zip artifact with a detached
          # ASCII-armored signature. Skip files that already have an
          # .asc sibling (idempotent re-runs).
          # --passphrase is passed via --passphrase-fd to avoid leaking
          # the passphrase in process listings. If GPG_PASSPHRASE is empty
          # (no passphrase), --batch + --pinentry-mode loopback handles it.
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) ! -name '*.asc' -print0 \
            | while IFS= read -r -d '' artifact; do
                if [ -f "${artifact}.asc" ]; then
                  echo "  (existing sig) ${artifact}.asc"
                  continue
                fi
                echo "  signing ${artifact}"
                if [ -n "${GPG_PASSPHRASE}" ]; then
                  echo "${GPG_PASSPHRASE}" | gpg --batch --yes --detach-sign --armor \
                      --local-user "${GPG_KEY_ID}" \
                      --pinentry-mode loopback \
                      --passphrase-fd 0 \
                      --output "${artifact}.asc" "${artifact}"
                else
                  gpg --batch --yes --detach-sign --armor \
                      --local-user "${GPG_KEY_ID}" \
                      --pinentry-mode loopback \
                      --output "${artifact}.asc" "${artifact}"
                fi
              done
          echo "--- Signed artifacts ---"
          find . -name '*.asc' -print | sort
          echo "--- End signed artifacts ---"

      - name: Generate release body
        shell: bash
        run: |
          # The release body is generated by scripts/release/generate-release-notes.sh
          # (single source of truth — one implementation shared by the
          # workflow and any local/manual generation, no dual drift).
          #
          # PREV_TAG semantics:
          # - Pre-release: prev = any previous tag (including pre-releases).
          #   Users testing pre-release builds want to see what changed
          #   since the last build.
          # - Stable: prev = nearest previous STABLE tag (skip pre-releases).
          #   The stable changelog spans from the last stable release.
          #
          # LAST_STABLE_TAG: pre-release bodies render a dual range
          # ("N commits since previous build · M commits since last stable").
          # Stable releases collapse to a single range (PREV == LAST_STABLE).
          TAG="${{ steps.ver.outputs.tag }}"
          IS_PRERELEASE="${{ steps.ver.outputs.prerelease }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          else
            PREV_TAG=$(git tag --sort=-creatordate \
              | grep -v "^${TAG}$" \
              | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|nightly)[\.-]' \
              | head -1 || true)
          fi

          LAST_STABLE_TAG=$(git tag --sort=-creatordate \
            | grep -v "^${TAG}$" \
            | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|pre|nightly)[\.-]' \
            | head -1 || true)

          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            ./scripts/release/generate-release-notes.sh \
              "${PREV_TAG}..${TAG}" "${TAG}" "${IS_PRERELEASE}" "${PREV_TAG}" "${LAST_STABLE_TAG}" \
              > release-body.md
          else
            # First release ever (no previous tag).
            ./scripts/release/generate-release-notes.sh "" "${TAG}" "${IS_PRERELEASE}" "" "" \
              > release-body.md
          fi
          echo "=== Release body ==="
          cat release-body.md

      # IMMUTABLE-RELEASE FIX (modeled on the sibling's release lane):
      # create the release as a DRAFT. GitHub's immutable-release feature
      # locks assets the moment a release becomes published, and
      # softprops/action-gh-release publishes on creation - so on an
      # immutable repo the tail of a multi-asset upload gets rejected
      # once the first asset trips the publish event (the sibling's
      # v80.0.1 incident: 7 of 10 assets landed, 3 rejected). With
      # draft: true the release stays mutable for the whole upload, and
      # the next step publishes it atomically after every asset is in
      # place. The unmatched-files seatbelt below also fails the release
      # instead of shipping an asset-less page.
      - name: Create Release (draft)
        id: gh_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # Release title: append "(Pre-Release)" for pre-release versions
          # so users can distinguish them at a glance in the GitHub releases
          # list. Final releases use the bare tag name as the title.
          name: ${{ steps.ver.outputs.tag }}${{ steps.ver.outputs.prerelease == 'true' && ' (Pre-Release)' || '' }}
          body_path: release-body.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha512sum
            dist/**/*.tar.gz.b3sum
            dist/**/*.tar.gz.shake256
            dist/**/*.tar.gz.asc
            dist/**/*.zip
            dist/**/*.zip.sha512sum
            dist/**/*.zip.b3sum
            dist/**/*.zip.shake256
            dist/**/*.zip.asc

      # The un-draft half of the immutable-release fix: flip the draft to
      # published only AFTER every asset has uploaded, setting the
      # prerelease and latest flags explicitly so the post-publish state
      # is exactly what the pre-fix workflow intended. The post-condition
      # read is the tripwire - a release that is still a draft here is a
      # red pipeline, never a silent half-publish.
      - name: Publish Release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          IS_PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${IS_PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease=true --latest=false
          else
            gh release edit "${TAG}" --draft=false --prerelease=false --latest=true
          fi
          echo "--- Published release state ---"
          gh release view "${TAG}" --json url,isDraft,isPrerelease,isImmutable \
            --jq '{url: .url, isDraft: .isDraft, isPrerelease: .isPrerelease, isImmutable: .isImmutable}'
          STILL_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
          if [ "${STILL_DRAFT}" != "false" ]; then
            echo "::error::Release ${TAG} is still a draft after the un-draft step - refusing to continue"
            exit 1
          fi
          echo "Release ${TAG} published atomically after the full asset upload."

      # ------------------------------------------------------------------
      # Trigger AUR synchronization after successful release
      # ------------------------------------------------------------------
      # Uses repository_dispatch (not workflow_dispatch) because the
      # default GITHUB_TOKEN has permission to create repository_dispatch
      # events but NOT workflow_dispatch events (403 "Resource not
      # accessible by integration"). aur.yml listens for this event type.
      #
      # Only triggers for STABLE releases (not pre-release/alpha/rc/beta).
      # AUR only accepts stable packages — pre-release versions use _tag
      # which the AUR helpers may not resolve correctly, and users expect
      # the AUR package to track the latest stable release only.
      # ------------------------------------------------------------------
      - name: Trigger AUR sync
        if: steps.gh_release.outputs.id != '' && steps.ver.outputs.prerelease != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          echo "Triggering AUR sync for ${TAG} via repository_dispatch"
          # NIGHT-dinner-1: the dispatch POST rides the curl retry
          # contract. Safe to re-attempt: a duplicate dispatch queues a
          # second aur-sync run for the same tag, and aur.yml's
          # per-tag concurrency group plus the idempotent AUR push
          # make the second run a no-op sync of the same state.
          HTTP_CODE=$(curl -s --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 -o /tmp/aur_trigger_response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"aur-sync\",\"client_payload\":{\"tag\":\"${TAG}\"}}")
          echo "HTTP response: ${HTTP_CODE}"
          cat /tmp/aur_trigger_response.txt 2>/dev/null || true
          if [[ "${HTTP_CODE}" != "204" ]]; then
            echo "::error::AUR sync trigger failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "AUR sync triggered successfully"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
