  # ── Android aarch64 ───────────────────────────────────────────────
  build-android-aarch64:
    name: android-aarch64-native
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: 'aarch64-linux-android'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: android-aarch64-native
          RUSTFLAGS: '-C target-cpu=native'
        run: cargo build --profile pro-android-aarch64 --target aarch64-linux-android --locked
      - name: embedded-scan
        run: |
          bin="target/aarch64-linux-android/pro-android-aarch64/cosmostrix"
          strings "$bin" | grep -Fq 'android-aarch64-native' || { echo "FAIL: missing variant"; exit 1; }
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="android-aarch64-native"
          bindir="target/aarch64-linux-android/pro-android-aarch64"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: android-aarch64-native
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── PGO nitro build (Linux x86_64 v3 + v4) ──────────────────────
  # Profile-Guided Optimization: 3-stage pipeline (instrument →
  # benchmark → recompile with profile data). Produces the fastest
  # possible binary via real workload profiling.
  #
  # PGO is Linux x86_64-only by design:
  #   - macOS, Windows, FreeBSD, and ARM targets either lack PGO
  #     toolchain support, gain nothing from PGO (ARM is already
  #     well-tuned by LLVM), or would burn CI minutes on builds that
  #     cannot be distributed.
  #   - The matrix below only lists linux-amd64-v3 / v4 and runs-on
  #     is pinned to ubuntu-latest, so this job is structurally
  #     Linux-only.
  #
  # RECOVERY 2026-08-19: this job was deleted by commit 71fdaa5
  # ("ci(release): add release workflow and cold/silent release note
  # generator"). The ai-x agent was asked to make the release notes
  # "cold/silent" (no emoji) but instead rewrote the ENTIRE release.yml,
  # deleting all build jobs including PGO. A later session re-added 9
  # standard build jobs but did NOT restore the PGO job. This commit
  # restores it from the pre-deletion state (71fdaa5~1) with style
  # adjustments to match the current release.yml conventions.
  build-pgo:
    name: pgo-linux-${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [channel]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64-v3
            target_cpu: x86-64-v3
          - platform: linux-amd64-v4
            target_cpu: x86-64-v4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          components: rustfmt, clippy, llvm-tools-preview
      - name: Ensure llvm-tools-preview installed
        shell: bash
        run: |
          # rust-toolchain.toml in the repo only lists rustfmt + clippy.
          # It overrides the dtolnay/rust-toolchain components list, so
          # llvm-tools-preview (which provides llvm-profdata for PGO) is
          # NOT installed. Install it explicitly here.
          rustup component add llvm-tools-preview
          PROFDATA="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          if [ -x "${PROFDATA}" ]; then
            echo "llvm-profdata found at: ${PROFDATA}"
          else
            echo "::error::llvm-profdata not found after installing llvm-tools-preview"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
      - name: Set cargo build jobs
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(nproc 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS=2
          fi
          echo "CARGO_BUILD_JOBS=${JOBS}" >> "$GITHUB_ENV"
      - name: PGO build (3-stage instrument, benchmark, optimize)
        shell: bash
        env:
          COSMOSTRIX_TARGET_CPU: ${{ matrix.target_cpu }}
        run: |
          set -euo pipefail
          # Use build.sh pgo which handles all 3 stages including
          # llvm-profdata auto-detection from rustup.
          #
          # COSMOSTRIX_TARGET_CPU sets the FINAL binary's target-cpu.
          # The instrumented binary (Stage 1) uses a safe default
          # (x86-64-v3 on x86_64) so it can execute on the runner to
          # collect profile data — even when matrix.target_cpu is v4
          # and the runner lacks AVX-512. Profile data is CPU-feature-
          # independent (captures branch frequencies, not SIMD
          # codegen), so v3 instrumentation + v4 final is sound.
          ./scripts/build.sh pgo
      - name: Verify PGO binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/x86_64-unknown-linux-gnu/pgo-use/cosmostrix"
          if [ ! -f "${BIN}" ]; then
            echo "::error::PGO binary not found at ${BIN}"
            exit 1
          fi
          echo "PGO binary size: $(du -h "${BIN}" | cut -f1)"
          # v4 binaries may SIGILL on runners without AVX-512; use --doctor
          # which is pure computation (no SIMD hot path). Fall back to
          # strings verification if doctor crashes.
          if OUT="$("${BIN}" --doctor 2>&1)"; then
            grep -Fq "COSMOSTRIX DIAGNOSTICS REPORT" <<<"${OUT}" || { echo "::error::Doctor report missing"; exit 1; }
            grep -Fq "FEATURES" <<<"${OUT}" || { echo "::error::FEATURES section missing"; exit 1; }
            echo "PGO binary verified via --doctor."
          else
            echo "::warning::${BIN} --doctor exited non-zero (likely AVX-512 SIGILL). Verifying via strings."
            TEXT="$(strings "${BIN}")"
            grep -Fq "Cosmic Dragon" <<<"${TEXT}" || { echo "::error::Expected build signature"; exit 1; }
            echo "PGO binary verified via strings (v4 fallback)."
          fi
      - name: Package PGO binary
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          platform="${{ matrix.platform }}"
          bindir="target/x86_64-unknown-linux-gnu/pgo-use"
          tarfile="cosmostrix-bin-${tag}-${platform}-pgo.tar.gz"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          ls -lh "${tarfile}"
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-${{ matrix.platform }}
          path: |
            cosmostrix-bin-*-pgo.tar.gz
            cosmostrix-bin-*-pgo.tar.gz.sha512sum

  # ── FreeBSD aarch64 ───────────────────────────────────────────────
  build-freebsd-amd64:
    name: freebsd-amd64
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: 'x86_64-unknown-freebsd'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: freebsd-amd64
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
        run: cargo build --profile pro-freebsd-amd64 --target x86_64-unknown-freebsd --locked
      - name: embedded-scan
        run: |
          bin="target/x86_64-unknown-freebsd/pro-freebsd-amd64/cosmostrix"
          strings "$bin" | grep -Fq 'freebsd-amd64' || { echo "FAIL: missing variant"; exit 1; }
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="freebsd-amd64"
          bindir="target/x86_64-unknown-freebsd/pro-freebsd-amd64"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Publish GitHub Release ────────────────────────────────────────
  publish_release:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - channel
      - base-tag
      - build-linux-v3
      - build-linux-v4
      - build-linux-musl
      - build-linux-aarch64
      - build-macos-aarch64
      - build-windows-x86_64
      - build-windows-aarch64
      - build-android-aarch64
      - build-freebsd-amd64
      - build-pgo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: generate-release-notes
        id: notes
        env:
          BASE_TAG: ${{ needs.base-tag.outputs.base }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -n "$BASE_TAG" ]; then
            range="${BASE_TAG}..${tag}"
          else
            range="${tag}"
          fi
          notes="$(./scripts/generate-release-notes.sh "$range" "$tag")"
          {
            echo "body<<RELEASE_EOF"
            echo "$notes"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: publish
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.channel.outputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/cosmostrix-bin-*.tar.gz
            artifacts/cosmostrix-bin-*.tar.gz.sha512sum
            artifacts/cosmostrix-bin-*.zip
            artifacts/cosmostrix-bin-*.zip.sha512sum

      # ── AUR Sync trigger ───────────────────────────────────────────
      # After the GitHub Release is published, trigger the AUR sync
      # workflow via repository_dispatch. The aur.yml workflow picks up
      # the tag from the client_payload and syncs PKGBUILD + .SRCINFO
      # to the Arch User Repository.
      #
      # Only triggers on STABLE releases (pre-release tags are rejected
      # by aur.yml itself — AUR policy requires stable versioning).
      # The `if` guard here is a belt-and-suspenders check: skip the
      # dispatch entirely for pre-releases to avoid unnecessary API calls.
      - name: Trigger AUR sync
        if: ${{ needs.channel.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Triggering AUR sync for stable release: ${TAG}"
          curl --fail \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"aur-sync\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
