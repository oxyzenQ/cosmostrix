#
# Cosmostrix Release Workflow
#
# Triggers on tag push matching v*.
# Builds cross-platform release binaries, generates SHA-512 checksums,
# auto-detects the previous tag for release notes, and publishes
# to GitHub Releases.
#
# Aesthetic: cold, silent, cosmic dragon. Zero emoji. No decoration.
# Release notes use <details><summary> for clickable expand/collapse.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ── Determine release channel ──────────────────────────────────────
  channel:
    name: channel
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.detect.outputs.prerelease }}
    steps:
      - id: detect
        run: |
          tag="${GITHUB_REF_NAME}"
          # v50 (2026-08-17) nightly support: added 'nightly' and 'pre'
          # to the pre-release channel list so vX.Y.Z-nightly.N and
          # vX.Y.Z-pre.N tags are correctly marked as GitHub prereleases.
          if [[ "$tag" =~ -(alpha|beta|rc|pre|nightly)\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Auto-detect previous tag for release note range ────────────────
  base-tag:
    name: base-tag
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.find.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        run: |
          current="${GITHUB_REF_NAME}"
          # List all v* tags sorted by version descending, skip current
          prev="$(git tag -l 'v*' --sort=-version:refname | grep -v "^${current}$" | head -n1)"
          if [ -z "$prev" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous tag found. Release notes will cover full history."
          else
            echo "base=${prev}" >> "$GITHUB_OUTPUT"
            echo "::notice::Base tag auto-detected: ${prev}"
          fi

  # ── Linux x86_64 v3 ───────────────────────────────────────────────
  build-linux-v3:
    name: linux-amd64-v3
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: linux-amd64-v3
          COSMOSTRIX_PROFILE: pro-linux-v3
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
        run: cargo build --profile pro-linux-v3 --locked
      - name: verify
        run: target/x86_64-unknown-linux-gnu/pro-linux-v3/cosmostrix --doctor
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="linux-amd64-v3"
          bindir="target/x86_64-unknown-linux-gnu/pro-linux-v3"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-v3
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Linux x86_64 v4 ───────────────────────────────────────────────
  build-linux-v4:
    name: linux-amd64-v4
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: linux-amd64-v4
          COSMOSTRIX_PROFILE: pro-linux-v4
          RUSTFLAGS: '-C target-cpu=x86-64-v4'
        run: cargo build --profile pro-linux-v4 --locked
      - name: embedded-scan
        # v4 binary may not execute on runners without AVX-512
        run: |
          bin="target/x86_64-unknown-linux-gnu/pro-linux-v4/cosmostrix"
          strings "$bin" | grep -Fq 'linux-amd64-v4' || { echo "FAIL: missing variant"; exit 1; }
          strings "$bin" | grep -Fq 'static optimized build' || { echo "FAIL: missing dispatch"; exit 1; }
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="linux-amd64-v4"
          bindir="target/x86_64-unknown-linux-gnu/pro-linux-v4"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-v4
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Linux x86_64 musl ─────────────────────────────────────────────
  build-linux-musl:
    name: linux-amd64-musl
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: 'x86_64-unknown-linux-musl'
      - name: install-musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: linux-amd64-musl
          COSMOSTRIX_PROFILE: pro-linux-musl
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
        run: cargo build --profile pro-linux-musl --target x86_64-unknown-linux-musl --locked
      - name: verify
        run: target/x86_64-unknown-linux-musl/pro-linux-musl/cosmostrix --doctor
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="linux-amd64-musl"
          bindir="target/x86_64-unknown-linux-musl/pro-linux-musl"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-musl
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Linux aarch64 ─────────────────────────────────────────────────
  build-linux-aarch64:
    name: linux-aarch64
    runs-on: ubuntu-24.04-arm
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: linux-aarch64
          RUSTFLAGS: '-C target-cpu=native'
        run: cargo build --release --locked
      - name: verify
        run: target/release/cosmostrix --doctor
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="linux-aarch64"
          bindir="target/release"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── macOS aarch64 ─────────────────────────────────────────────────
  build-macos-aarch64:
    name: darwin-aarch64-native
    runs-on: macos-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: darwin-aarch64-native
          RUSTFLAGS: '-C target-cpu=native'
        run: cargo build --profile pro-macos-aarch64-native --locked
      - name: verify
        run: target/aarch64-apple-darwin/pro-macos-aarch64-native/cosmostrix --doctor
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="darwin-aarch64-native"
          bindir="target/aarch64-apple-darwin/pro-macos-aarch64-native"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          shasum -a 512 "${tarfile}" > "${tarfile}.sha512sum"
          shasum -a 512 "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-aarch64-native
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Windows x86_64 ────────────────────────────────────────────────
  build-windows-x86_64:
    name: windows-x86_64
    runs-on: windows-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: windows-x86_64
        run: cargo build --profile pro-win-amd64 --locked
      - name: package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="windows-x86_64"
          bindir="target/x86_64-pc-windows-msvc/pro-win-amd64"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix.exe" staging/
          cp README.md LICENSE staging/
          zip -q "${zipfile}" -j staging/cosmostrix.exe staging/README.md staging/LICENSE
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Windows aarch64 ───────────────────────────────────────────────
  build-windows-aarch64:
    name: windows-aarch64-native
    runs-on: windows-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: 'aarch64-pc-windows-msvc'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: windows-aarch64-native
          RUSTFLAGS: '-C target-cpu=native'
        run: cargo build --profile pro-win-aarch64 --target aarch64-pc-windows-msvc --locked
      - name: package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="windows-aarch64-native"
          bindir="target/aarch64-pc-windows-msvc/pro-win-aarch64"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix.exe" staging/
          cp README.md LICENSE staging/
          zip -q "${zipfile}" -j staging/cosmostrix.exe staging/README.md staging/LICENSE
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-aarch64-native
          path: |
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Android aarch64 ───────────────────────────────────────────────
  build-android-aarch64:
    name: android-aarch64-native
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: 'aarch64-linux-android'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: android-aarch64-native
          RUSTFLAGS: '-C target-cpu=native'
        run: cargo build --profile pro-android-aarch64 --target aarch64-linux-android --locked
      - name: embedded-scan
        run: |
          bin="target/aarch64-linux-android/pro-android-aarch64/cosmostrix"
          strings "$bin" | grep -Fq 'android-aarch64-native' || { echo "FAIL: missing variant"; exit 1; }
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="android-aarch64-native"
          bindir="target/aarch64-linux-android/pro-android-aarch64"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: android-aarch64-native
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── FreeBSD aarch64 ───────────────────────────────────────────────
  build-freebsd-amd64:
    name: freebsd-amd64
    runs-on: ubuntu-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
          targets: 'x86_64-unknown-freebsd'
      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: freebsd-amd64
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
        run: cargo build --profile pro-freebsd-amd64 --target x86_64-unknown-freebsd --locked
      - name: embedded-scan
        run: |
          bin="target/x86_64-unknown-freebsd/pro-freebsd-amd64/cosmostrix"
          strings "$bin" | grep -Fq 'freebsd-amd64' || { echo "FAIL: missing variant"; exit 1; }
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="freebsd-amd64"
          bindir="target/x86_64-unknown-freebsd/pro-freebsd-amd64"
          tarfile="cosmostrix-bin-${tag}-${platform}.tar.gz"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix" staging/
          cp README.md LICENSE staging/
          tar -czf "${tarfile}" -C staging .
          zip -q "${zipfile}" -j staging/cosmostrix staging/README.md staging/LICENSE
          sha512sum "${tarfile}" > "${tarfile}.sha512sum"
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-amd64
          path: |
            cosmostrix-bin-*.tar.gz
            cosmostrix-bin-*.tar.gz.sha512sum
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Publish GitHub Release ────────────────────────────────────────
  publish_release:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - channel
      - base-tag
      - build-linux-v3
      - build-linux-v4
      - build-linux-musl
      - build-linux-aarch64
      - build-macos-aarch64
      - build-windows-x86_64
      - build-windows-aarch64
      - build-android-aarch64
      - build-freebsd-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: generate-release-notes
        id: notes
        env:
          BASE_TAG: ${{ needs.base-tag.outputs.base }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -n "$BASE_TAG" ]; then
            range="${BASE_TAG}..${tag}"
          else
            range="${tag}"
          fi
          notes="$(./scripts/generate-release-notes.sh "$range" "$tag")"
          {
            echo "body<<RELEASE_EOF"
            echo "$notes"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: publish
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.channel.outputs.prerelease }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/cosmostrix-bin-*.tar.gz
            artifacts/cosmostrix-bin-*.tar.gz.sha512sum
            artifacts/cosmostrix-bin-*.zip
            artifacts/cosmostrix-bin-*.zip.sha512sum
