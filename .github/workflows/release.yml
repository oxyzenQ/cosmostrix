      - name: test
        run: cargo test --all --locked
      - name: build
        env:
          COSMOSTRIX_BUILD: windows-x86_64
        run: cargo build --profile pro-win-amd64 --locked
      - name: package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          platform="windows-x86_64"
          bindir="target/x86_64-pc-windows-msvc/pro-win-amd64"
          zipfile="cosmostrix-bin-${tag}-${platform}.zip"
          mkdir -p staging
          cp "${bindir}/cosmostrix.exe" staging/
          cp README.md LICENSE staging/
          zip -q "${zipfile}" -j staging/cosmostrix.exe staging/README.md staging/LICENSE
          sha512sum "${zipfile}" > "${zipfile}.sha512sum"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            cosmostrix-bin-*.zip
            cosmostrix-bin-*.zip.sha512sum

  # ── Windows aarch64 ───────────────────────────────────────────────
  build-windows-aarch64:
    name: windows-aarch64-native
    runs-on: windows-latest
    needs: [channel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
