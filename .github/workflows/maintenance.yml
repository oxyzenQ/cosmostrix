# Schedule: Weekly on Monday 00:00 UTC
#
# Report-first dependency maintenance (owner directive 2026-08-23):
# - validate: read-only token, dependency update, full checks, lockfile artifact
# - report: open a Pull Request with the validated lockfile — the owner
#   reviews and merges. NO bot ever pushes directly to main.
#
# ── How this workflow authenticates WITHOUT a personal access token ──
#
# GitHub Actions auto-provisions a short-lived installation token
# (`GITHUB_TOKEN`) for every workflow run. It is repo-scoped, expires when
# the job ends, and its permissions are exactly what the `permissions:`
# block of each job declares:
#   - validate: contents:read  + persist-credentials:false → cannot push
#   - report:   contents:write + pull-requests:write → can push ONE branch
#     and open the report PR (github-actions[bot] identity)
# No PAT is stored or needed. Commits made with GITHUB_TOKEN do not
# recursively trigger other workflows (GitHub recursion guard), which is
# fine here: validation already ran in the validate job.

name: Cosmic Dragon Guard - Dependency Maintenance

'on':
  schedule:
    - cron: "0 7 * * 1"  # Monday 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # Single source of truth for Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version.
  RUST_VERSION: "1.97.1"
  # GPG signing key fingerprint (master key).
  GPG_KEY_FINGERPRINT: "47A50AEF4B65AAC2"
  # Warn this many days before the signing subkey expires.
  GPG_EXPIRY_WARN_DAYS: 30
  # Bot identity for the dependency-update report PR. Centralized here
  # so rotating it is a one-line edit (owner request 2026-08-23; previously
  # hardcoded inline in the commit step).
  GIT_BOT_NAME: "github-actions[bot]"
  GIT_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  gpg-key-check:
    name: Cosmic Dragon Guard - GPG Signing Key Expiry Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public key and check expiry
        shell: bash
        run: |
          set -euo pipefail

          # Import the signing key from a public keyserver
          gpg --batch --keyserver keys.openpgp.org \
            --recv-keys "${GPG_KEY_FINGERPRINT}" 2>/dev/null || \
          gpg --batch --keyserver keyserver.ubuntu.com \
            --recv-keys "${GPG_KEY_FINGERPRINT}" 2>/dev/null || {
            echo "::warning::Could not fetch GPG key ${GPG_KEY_FINGERPRINT} from keyservers"
            exit 0  # non-fatal — network glitch should not break the pipeline
          }

          # Extract signing subkey expiry dates (skip master key + revoked subkeys).
          # GPG colon format: sub:usage:validity:start:expiry:...
          # Field 2 validity: n=valid, r=revoked, e=expired, i=invalid, d=disabled
          EXPIRY_LINES=$(gpg --batch --with-colons --list-keys "${GPG_KEY_FINGERPRINT}" \
            | awk -F: '/^sub:/ && $2 != "r"')

          if [[ -z "$EXPIRY_LINES" ]]; then
            echo "No signing subkeys found (master key may have no subkeys)"
            exit 0
          fi

          WARN=false
          NOW=$(date +%s)

          while IFS= read -r line; do
            # GPG colon-delimited format: sub:usage:validity:start:expiry:...
            EXPIRY=$(echo "$line" | cut -d: -f6)
            KEY_ID=$(echo "$line" | cut -d: -f5)

            if [[ -z "$EXPIRY" || "$EXPIRY" == "" ]]; then
              echo "Subkey ${KEY_ID}: no expiry (never expires)"
              continue
            fi

            # GPG expiry is UNIX epoch
            EXPIRY_SEC=$(date -d "@${EXPIRY}" +%s 2>/dev/null || echo "0")
            REMAINING=$(( (EXPIRY_SEC - NOW) / 86400 ))
            EXPIRY_DATE=$(date -d "@${EXPIRY}" +%Y-%m-%d 2>/dev/null || echo "unknown")

            if [[ "$REMAINING" -le 0 ]]; then
              echo "::error::GPG signing subkey ${KEY_ID} EXPIRED on ${EXPIRY_DATE} (${REMAINING} days ago). Renew immediately."
              WARN=true
            elif [[ "$REMAINING" -le "$GPG_EXPIRY_WARN_DAYS" ]]; then
              echo "::warning::GPG signing subkey ${KEY_ID} expires on ${EXPIRY_DATE} (${REMAINING} days remaining). Renew within ${GPG_EXPIRY_WARN_DAYS} days."
              WARN=true
            else
              echo "GPG signing subkey ${KEY_ID}: expires ${EXPIRY_DATE} (${REMAINING} days remaining) — OK"
            fi
          done <<< "$EXPIRY_LINES"

          if $WARN; then
            echo ""
            echo "Action required: rotate the signing subkey and update keyservers."
            echo "See docs/VERIFY_RELEASE.md for the renewal procedure."
          fi

  validate:
    name: Cosmic Dragon Guard - Dependency Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Setup cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set cargo build jobs
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(nproc 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS=2
          fi
          echo "CARGO_BUILD_JOBS=${JOBS}" >> "$GITHUB_ENV"

      - name: Install audit + deny tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Baseline security audit
        run: cargo audit

      - name: Update dependencies
        run: cargo update --workspace

      - name: Enforce dependency-only diff
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies are already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify Cargo.lock"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Security audit
        if: steps.changes.outputs.changed == 'true'
        run: cargo audit

      - name: Dependency policy
        if: steps.changes.outputs.changed == 'true'
        run: cargo deny check all

      - name: Format check
        if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --all -- --check

      - name: Build project
        if: steps.changes.outputs.changed == 'true'
        run: |
          cargo build --profile dev --locked --jobs "${CARGO_BUILD_JOBS}"
          cargo build --profile release --locked --jobs "${CARGO_BUILD_JOBS}"
          # Owner directive 2026-08-23: validate the plain `pro` profile
          # (native target, no -C target-cpu pin) instead of pro-linux-v3 —
          # dependency validation does not need a pinned microarch level,
          # and plain pro builds on any runner arch (incl. future arm64).
          cargo build --profile pro --locked --jobs "${CARGO_BUILD_JOBS}"

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test --all --locked

      - name: Clippy
        if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Upload validated Cargo.lock
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: validated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  report:
    name: Cosmic Dragon Guard - Dependency Update Report
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    timeout-minutes: 10
    permissions:
      # contents:write pushes the single update branch.
      # pull-requests:write opens the report PR. The owner merges it —
      # nothing lands on main without a human decision.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download validated Cargo.lock
        uses: actions/download-artifact@v6
        with:
          name: validated-cargo-lock
          path: .auto-update

      - name: Open dependency-update Pull Request (report-first)
        shell: bash
        env:
          # github.token == the run's ephemeral GITHUB_TOKEN (see the
          # workflow header). gh CLI authenticates with it.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp .auto-update/Cargo.lock Cargo.lock

          if git diff --quiet; then
            echo "Validated lockfile is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Report job may only modify Cargo.lock"
            exit 1
          fi

          # Identity comes from the workflow env block (single source).
          git config user.name "${GIT_BOT_NAME}"
          git config user.email "${GIT_BOT_EMAIL}"

          BRANCH="deps/auto-update-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH}"
          git add Cargo.lock
          git commit -m "chore(deps): weekly dependency update (validated)"
          git push origin "${BRANCH}"

          # The report: a PR the owner reviews and merges. Cargo.lock diff
          # summary + validation evidence in the body.
          UPDATED="$(git diff --stat HEAD~1..HEAD | tail -n1)"
          gh pr create \
            --title "chore(deps): weekly dependency update (validated)" \
            --base main \
            --head "${BRANCH}" \
            --body "Automated dependency update report — **no code touched, Cargo.lock only**.

          Validated by the weekly maintenance run:
          - cargo audit (baseline + post-update)
          - cargo deny check all
          - cargo fmt --check
          - build: dev + release + pro profiles, --locked
          - cargo test --all --locked
          - clippy -D warnings

          Diff: ${UPDATED}

          Merge to apply. Closing the PR discards the update." \
            || echo "::warning::PR already exists or creation failed — the branch ${BRANCH} is pushed for manual review"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
