# SPDX-License-Identifier: AGPL-3.0-only OR Commercial
# Schedule: Weekly on Sunday 10:00 WIB (03:00 UTC) - the estate-wide Sunday lane
# (night-consistent-1: every scheduled workflow runs at the same
# Sunday slot)
#
# Direct-main dependency updates use a two-phase privilege model:
# - validate: read-only token, dependency update, full checks, lockfile artifact
# - commit: write token, no dependency code execution, workspace
#   Cargo.lock allowlist only (night-zen-1: every workspace lockfile,
#   not just the root's)
#
# ── How this workflow authenticates WITHOUT a personal access token ──
#
# GitHub Actions auto-provisions a short-lived installation token
# (`GITHUB_TOKEN`) for every workflow run. It is repo-scoped, expires when
# the job ends, and its permissions are exactly what each job's
# `permissions:` block declares:
#   - validate: contents:read + persist-credentials:false → cannot push
#   - commit:   contents:write → can push the validated Cargo.lock to main
# No PAT is stored or needed. Commits made with GITHUB_TOKEN appear as
# github-actions[bot] and do not recursively trigger other workflows
# (GitHub recursion guard).

name: Cosmic Dragon Guard - Dependency Maintenance

'on':
  schedule:
    - cron: '0 3 * * 0'  # Sunday 10:00 WIB (03:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  # Single source of truth for Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version.
  RUST_VERSION: "1.98.1"
  # Strict build lane (the ci.yml law): every cargo invocation in this
  # workflow denies warnings, and scripts/ci/ci-strict-build.sh adds
  # the post-hoc warning scan on top. The alias-driven build carries a
  # step-level RUSTFLAGS override (night-dragon-maintenance-11): the
  # env value shadows the alias's --config build.rustflags, so that
  # step must re-add the alias's exact -C target-cpu token.
  RUSTFLAGS: "-D warnings"
  # GPG signing key fingerprint (master key). Full 40-char fingerprint.
  GPG_KEY_FINGERPRINT: "F5324E0967F104D58CE025F347A50AEF4B65AAC2"
  # Warn this many days before the signing subkey expires.
  GPG_EXPIRY_WARN_DAYS: 30
  # Bot identity for the dependency-update report PR. Centralized here
  # so rotating it is a one-line edit (owner request 2026-08-23; previously
  # hardcoded inline in the commit step).
  GIT_BOT_NAME: "github-actions[bot]"
  GIT_BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  gpg-key-check:
    name: Cosmic Dragon Guard - GPG Signing Key Expiry Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch public key and check expiry
        shell: bash
        run: |
          set -euo pipefail

          # Import the signing key from a public keyserver, verifying
          # keyring PRESENCE after every attempt — the recv exit code
          # is not trusted (CI incident, Dependency Maintenance run
          # #46, 2026-11-21): keys.openpgp.org is a verifying keyserver
          # and serves this key without user IDs (none of its
          # identities are verified there), and gpg SKIPS a UID-less
          # key on import ("new key but contains no user ID - skipped")
          # while still exiting 0. A bare `||` chain therefore stopped
          # on the first server with an empty keyring, the ubuntu
          # fallback never ran, and the expiry parse below died with
          # "error reading key: No public key" (exit 2). Ubuntu is
          # tried first because it is the documented source of truth
          # (docs/VERIFY_RELEASE.md) and imports the full key today;
          # keys.openpgp.org stays as the second attempt in case its
          # identities get verified there later. Server output stays
          # visible so a future failure is diagnosable from the log.
          KEY_FETCHED=false
          for SERVER in keyserver.ubuntu.com keys.openpgp.org; do
            echo "Fetching ${GPG_KEY_FINGERPRINT} from ${SERVER} ..."
            gpg --batch --keyserver "${SERVER}" \
              --recv-keys "${GPG_KEY_FINGERPRINT}" || true
            if gpg --batch --list-keys "${GPG_KEY_FINGERPRINT}" >/dev/null 2>&1; then
              KEY_FETCHED=true
              break
            fi
          done
          if [[ "${KEY_FETCHED}" != "true" ]]; then
            echo "::warning::Could not fetch GPG key ${GPG_KEY_FINGERPRINT} from any keyserver"
            exit 0  # non-fatal — network glitch should not break the pipeline
          fi

          # Extract signing subkey expiry dates (skip master key + revoked subkeys).
          # GPG colon format field layout for a `sub:` record:
          #   f1=sub  f2=validity  f3=keylen  f4=algo  f5=keyid
          #   f6=CREATION epoch  f7=EXPIRY epoch
          # (Bugfix 2026-08-23: this check previously read f6 — the CREATION
          # date — and reported freshly-created subkeys as expired on their
          # own birth date. Caught when the owner's subkey created
          # 2026-08-11 with expiry 2028-08-14 was flagged "EXPIRED on
          # 2026-08-11". Field 7 is the expiry; an empty f7 = never expires.)
          EXPIRY_LINES=$(gpg --batch --with-colons --list-keys "${GPG_KEY_FINGERPRINT}" \
            | awk -F: '/^sub:/ && $2 != "r"')

          if [[ -z "$EXPIRY_LINES" ]]; then
            echo "No signing subkeys found (master key may have no subkeys)"
            exit 0
          fi

          WARN=false
          NOW=$(date +%s)

          while IFS= read -r line; do
            # GPG colon-delimited format (see field layout above): f5=keyid,
            # f6=creation, f7=expiry.
            EXPIRY=$(echo "$line" | cut -d: -f7)
            KEY_ID=$(echo "$line" | cut -d: -f5)

            if [[ -z "$EXPIRY" || "$EXPIRY" == "" ]]; then
              echo "Subkey ${KEY_ID}: no expiry (never expires)"
              continue
            fi

            # GPG expiry is UNIX epoch
            EXPIRY_SEC=$(date -d "@${EXPIRY}" +%s 2>/dev/null || echo "0")
            REMAINING=$(( (EXPIRY_SEC - NOW) / 86400 ))
            EXPIRY_DATE=$(date -d "@${EXPIRY}" +%Y-%m-%d 2>/dev/null || echo "unknown")

            if [[ "$REMAINING" -le 0 ]]; then
              echo "::error::GPG signing subkey ${KEY_ID} EXPIRED on ${EXPIRY_DATE} (${REMAINING} days ago). Renew immediately."
              WARN=true
            elif [[ "$REMAINING" -le "$GPG_EXPIRY_WARN_DAYS" ]]; then
              echo "::warning::GPG signing subkey ${KEY_ID} expires on ${EXPIRY_DATE} (${REMAINING} days remaining). Renew within ${GPG_EXPIRY_WARN_DAYS} days."
              WARN=true
            else
              echo "GPG signing subkey ${KEY_ID}: expires ${EXPIRY_DATE} (${REMAINING} days remaining) — OK"
            fi
          done <<< "$EXPIRY_LINES"

          if $WARN; then
            echo ""
            echo "Action required: rotate the signing subkey and update keyservers."
            echo "See docs/VERIFY_RELEASE.md for the renewal procedure."
          fi

  validate:
    name: Cosmic Dragon Guard - Dependency Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set cargo build jobs
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(nproc 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || true)"
          fi
          if [[ -z "${JOBS}" ]]; then
            JOBS=2
          fi
          echo "CARGO_BUILD_JOBS=${JOBS}" >> "$GITHUB_ENV"

      - name: Install audit + deny tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Tiered supply chain guard (owner directive 2026-11-21, the
      # sleeping-owner contract): plain cargo audit fails on every
      # advisory and cannot tell the two maintenance scenarios apart.
      # The guard classifies RustSec findings by fixability:
      #   - patched version exists -> non-blocking, UPDATE ASAP banner
      #     (the lane continues and the bot may still refresh locks)
      #   - no patched version -> exit 1, CALL OWNER banner (the run
      #     fails hard, the scheduled-failure notification reaches the
      #     owner, and no dependency commit may land while the risk
      #     stands)
      # Any audit infrastructure failure (missing tool, missing
      # lockfile set, malformed report) also exits 1: a broken guard
      # must never pass silently.
      # Scope follows the night-zen-1 law: the lockfile set comes from
      # the same canonical manifest walk the refresh and the commit
      # phase use (--list mode), so the root-only cargo audit this
      # step replaces never audited fuzz/ or pgo-runner/ here.
      - name: Baseline security audit
        run: python3 scripts/ci/security-guard.py --phase baseline

      # night-zen-1 (the zejtron law): the refresh walks every committed
      # Cargo.toml and runs cargo update in each workspace, so fuzz/ and
      # pgo-runner/ ride the same weekly lane as the root crate. The
      # root-only cargo update left two of the three committed lockfiles
      # permanently stale. New workspaces join the lane without touching
      # this file; target trees are excluded so cache-restored build
      # output can never join the walk. The walk itself lives in
      # scripts/ci/update-all-workspaces.sh - the single canonical
      # definition shared with the commit phase below.
      - name: Update dependencies
        shell: bash
        run: bash scripts/ci/update-all-workspaces.sh

      # night-zen-1: every workspace lockfile is in scope, so the gate
      # accepts any repo-relative Cargo.lock path, not just the root's.
      - name: Enforce dependency-only diff
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies are already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '(^|/)Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify Cargo.lock files"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Same tiered guard, post-update phase: cargo update has just run
      # on every workspace, so this audits the exact lock state the
      # commit phase would publish. Tier 2 here means the refresh
      # itself introduced an unfixable advisory - the lane stops and
      # nothing is committed.
      - name: Security audit
        if: steps.changes.outputs.changed == 'true'
        run: python3 scripts/ci/security-guard.py --phase post-update

      # Ownership split (owner directive 2026-11-21): deny keeps the
      # yanked / bans / licenses / sources hard gates, while advisory
      # vulnerabilities are warn-level here - the tiered guard above
      # owns that verdict (deny.toml [advisories] records the same
      # contract).
      - name: Dependency policy
        if: steps.changes.outputs.changed == 'true'
        run: cargo deny check all

      - name: Format check
        if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --all -- --check

      - name: Build project (dev)
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/ci-strict-build.sh -- build --profile dev --locked --jobs "${CARGO_BUILD_JOBS}"

      - name: Build project (release-shape alias validation)
        if: steps.changes.outputs.changed == 'true'
        env:
          # night-dragon-maintenance-11 (the RUSTFLAGS env shadow, the
          # ci.yml v80 contract rule 3, the supermassive build_musl law):
          # cargo precedence gives the RUSTFLAGS env shadow over the
          # alias's --config build.rustflags, so the workflow-level
          # RUSTFLAGS="-D warnings" silently dropped the alias's
          # -C target-cpu=x86-64-v3 token and build.rs rejected the
          # claimed x86-64-v3 baseline (missing avx2,bmi2,fma) every
          # time this lane ran with fresh dependency updates (red since
          # ad7a045 added the global env). This step-level override
          # REPLACES the global env and MUST re-add -D warnings (the
          # strict law holds) plus the alias's exact -C token -
          # byte-for-byte the supermassive.yml x86_64 matrix shape.
          RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"
        run: |
          # Owner directive 2026-10-27 (night-dragon-maintenance-3): builds
          # ride the named alias path - never a bare cargo release build.
          # night-dragon-maintenance-6: the validation build is the static
          # musl release shape (the gnu alias pair is retired).
          # night-T-2 follow-up 16 (the zejtron law): no apt - the alias
          # links self-contained via rust-lld (no cc in the lockfile), so
          # the lane carries no mirror outage surface.
          bash scripts/ci/ci-strict-build.sh -- pro-linux-amd64-v3-musl --locked

      - name: Run tests
        if: steps.changes.outputs.changed == 'true'
        run: bash scripts/ci/ci-strict-build.sh -- test --all --locked

      - name: Clippy
        if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # night-zen-1: the artifact carries every workspace lockfile; the
      # glob picks up future workspaces without touching this file.
      - name: Upload validated Cargo.lock
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validated-cargo-lock
          path: '**/Cargo.lock'
          if-no-files-found: error

  commit:
    name: Cosmic Dragon Guard - Dependency Commit
    runs-on: ubuntu-24.04
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download validated Cargo.lock
        uses: actions/download-artifact@v8
        with:
          name: validated-cargo-lock
          # night-zen-1 hotfix: staging lands under runner.temp, outside
          # the work tree. An in-tree staging directory was once one glob
          # away from being swept into the bot commit; out-of-tree makes
          # that class impossible, and the .gitignore .auto-update/ entry
          # is the second wall against any future in-tree regression.
          path: ${{ runner.temp }}/auto-update

      # night-zen-1: restore every workspace lockfile the validate job
      # uploaded (the artifact keeps the repo-relative layout).
      - name: Commit dependency update
        shell: bash
        run: |
          set -euo pipefail
          # The expected lockfile set comes from the same canonical walk
          # the validate job used (--list mode of the same script, so the
          # two phases can never drift). The path form is repo-relative,
          # matching `git diff --name-only` output exactly.
          bash scripts/ci/update-all-workspaces.sh --list \
            | sed 's|Cargo\.toml$|Cargo.lock|' | sort > /tmp/locks.txt
          STAGE="${RUNNER_TEMP}/auto-update"
          while IFS= read -r rel; do
            if [[ -f "${STAGE}/${rel}" ]]; then
              cp "${STAGE}/${rel}" "$rel"
            else
              echo "::warning::No validated lockfile for ${rel} in the artifact"
            fi
          done < /tmp/locks.txt

          if git diff --quiet; then
            echo "Validated lockfile is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed.txt
          # The gate accepts only lockfiles in the expected set (exact
          # paths, not a path pattern). grep -v exits 1 when every line
          # matches the expected set — that is the pass case, hence the
          # || true guard.
          violations=$(grep -vxF -f /tmp/locks.txt /tmp/changed.txt || true)
          if [[ -n "$violations" ]]; then
            echo "Unexpected files in the dependency-only diff:"
            echo "$violations"
            echo "::error::Only workspace Cargo.lock files may change"
            exit 1
          fi

          # Identity comes from the workflow env block (single source).
          git config user.name "${GIT_BOT_NAME}"
          git config user.email "${GIT_BOT_EMAIL}"
          # Stage exact paths from the manifest walk — never a glob, so
          # no staging debris can ever join the bot commit.
          xargs -d '\n' -r git add -- < /tmp/locks.txt
          git commit -m "chore(deps): maintenance deps weekly"
          git push origin HEAD:main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
