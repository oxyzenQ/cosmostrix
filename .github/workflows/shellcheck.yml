#
# Shell lint CI — runs shellcheck on every *.sh file in the repository.
# Triggers whenever any shell script OR Rust source file is changed.
#
# Covers:
#   scripts/*.sh          (build, install, check-*, generate-*, etc.)
#   benchmark/*.sh        (benchmark runner)
#   any future *.sh files
#
# Also triggers on src/** changes so that a full CI gate runs on every
# Rust commit — owner wants all lints evaluated regardless of which
# files changed.
#
# Excluded: aur.yml, release.yml (tag-only / manual dispatch).
#
# Separated from workflow-ci.yml (which lints workflow YAML) and ci.yml
# (which compiles Rust) for strict path-isolated triggers.

name: Shell Lint

'on':
  push:
    branches: ["main"]
    paths:
      - '**.sh'
      - 'src/**'
  pull_request:
    branches: ["main"]
    paths:
      - '**.sh'
      - 'src/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Collect and lint shell scripts
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find . -name '*.sh' -not -path './.git/*' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No .sh files found — nothing to lint."
            exit 0
          fi
          echo "Linting ${#FILES[@]} shell script(s):"
          printf '%s\n' "${FILES[@]}"
          echo "---"
          shellcheck "${FILES[@]}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
