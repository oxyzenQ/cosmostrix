#
# Shell lint CI — runs shellcheck on every *.sh file in the repository.
# Triggers whenever any shell script is added, modified, or deleted.
#
# Covers:
#   scripts/*.sh          (build, install, check-*, generate-*, etc.)
#   benchmark/*.sh        (benchmark runner)
#   any future *.sh files
#
# Separated from workflow-ci.yml (which lints workflow YAML) and ci.yml
# (which compiles Rust) for strict path-isolated triggers.

name: Shell Lint

'on':
  push:
    branches: ["main"]
    paths:
      - '**.sh'
  pull_request:
    branches: ["main"]
    paths:
      - '**.sh'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Collect and lint shell scripts
        run: |
          set -euo pipefail
          FILES=$(find . -name '*.sh' -not -path './.git/*' | sort)
          if [ -z "${FILES}" ]; then
            echo "No .sh files found — nothing to lint."
            exit 0
          fi
          echo "Linting $(echo "${FILES}" | wc -l) shell script(s):"
          echo "${FILES}"
          echo "---"
          shellcheck ${FILES}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
