# =============================================================================
#
# Cosmic Dragon Guard - Supermassive (cosmostrix-sized runtime E2E).
#
# night-improve-7 (the owner's approved scope, 2026-10-11): a runtime
# battery in the zelynic supermassive lineage, scaled to what a
# userspace TUI actually owes. The name and the sentinel relay
# (MASS-RESULT rows, a verdict step, a step-summary watch) are the
# zelynic shape; the VMs are not, on purpose. zelynic boots micro-VMs
# because its failure classes live in the kernel (eBPF, cgroups,
# daemon crash/reload/race, container runtimes). cosmostrix is a
# renderer whose entire runtime contract is byte sequences on a tty,
# so the honest equivalent of a kernel-span battery is a REAL
# pseudo-terminal: raw mode entry, live input bytes, real signal
# delivery, and the restore sequences the LTS-1-audited exit stack
# emits on its way out. No VM leg, no container leg, no eBPF leg -
# those would burn minutes on failure classes this codebase cannot
# have.
#
# The four approved pieces, and where they landed:
#   1. PTY smoke leg (pty_smoke job) - the binary runs six times
#      under a real pty via scripts/supermassive/pty_smoke.py
#      (transport) and scripts/supermassive/pty_assert.py (byte
#      assertions). The three quit paths are each proven end to end:
#      --duration deadline exit, the 'q' quit key delivered as live
#      tty input, and SIGTERM graceful shutdown (SIGINT is
#      deliberately not a quit signal since the bug-15 follow-up, so
#      the signal leg uses SIGTERM like the signal_handlers contract).
#      Every leg asserts the restore tail (alt-screen leave, mouse /
#      paste / focus disables) the unit suite can only assert on
#      synthetic strings.
#   2. musl nextest leg (musl_tests job) - closes the libc axis.
#      release.yml ships a static musl artifact
#      (pro-linux-amd64-v3-musl) that had never been executed by any
#      CI before this workflow; here the whole workspace test suite
#      builds and runs under x86_64-unknown-linux-musl. Local
#      calibration: the musl test binary links via rust-lld and
#      executes standalone.
#   3. Color downgrade battery - rides inside the pty_smoke job as
#      three extra env legs (NO_COLOR, TERM=dumb, TERM=xterm). The
#      assertions are the empirically calibrated runtime contract,
#      not a restatement of the docs: truecolor is always absent on
#      the hosted runner palette; TERM=xterm-256color renders the
#      indexed tier; TERM=xterm renders basic 30-37/90-97 SGRs only;
#      TERM=dumb is the strongest downgrade (no color, no alternate
#      screen at all, restore-without-alt-screen still emitted);
#      NO_COLOR renders the grayscale indexed range (232-243) while
#      chromatic direct-color stays forbidden. The docs table in
#      src/output/mod.rs describes the Mono tier as plain text with
#      no escapes; the live render is stricter than that description
#      is precise about - the grayscale indexed SGRs are real output.
#      The source is truth: the assertions pin what the binary does.
#   4. Soak leg (soak job) - the longitudinal dataset. A single
#      --duration 300 render under the same pty driver with VmRSS
#      sampling every 10 s (read from /proc/<pid>/status, the child
#      is a direct fork). Calibration on a 25 s debug run read a
#      flat 9.5 MB RSS, so the CI bound is an anti-runaway ceiling
#      (peak below 1.5 GB), not a performance claim; the dataset is
#      the point. night-improve-10 (owner decision, 2026-10-11):
#      the soak rides every qualifying push. The old weekly cron
#      rendered this job as a permanent "(push) Skipped" row on
#      every code commit while the clock paid for renders nobody
#      was watching; per-push rows tie each dataset point to the
#      exact commit that produced it.
#   5. Torture leg (torture job) - the brutal server-simulation
#      battery (night-dragon-maintenance-4, owner directive):
#      scripts/supermassive/torture.py runs five hostile load
#      shapes under a real pty and asserts the contracts hold UNDER
#      ATTACK - a 10 Hz TIOCSWINSZ resize hammer across extreme
#      sizes, a ~200 writes/second junk-byte flood the 'q' quit
#      path must win through, a signal storm (five SIGINTs that
#      must NOT quit, the bug-15 contract, then one graceful
#      SIGTERM), a live-reload config churn mixing valid and
#      type-broken edits at 5 Hz against the safepath-whitelisted
#      default config path, and twelve randomized-size restart
#      sessions. Restore tails asserted through the same
#      pty_assert.py SEQ_TABLE grammar; every checked fact lands a
#      MASS-RESULT row; the harness was smoke-proven 5/5 against a
#      contract-stub renderer before landing.
#
# Trigger discipline (the owner's unfiltered-CI simplification,
# night-dragon-maintenance-2): the push trigger is unfiltered — no
# branch filter, no path filter. The former paths list duplicated
# ci.yml's spelling and owed this workflow a run whenever it could
# change its own contract; a blind push trigger retires that sync
# tax. workflow_dispatch stays as the manual recovery lane. No cron
# schedule on purpose (night-improve-10): no run is ever detached
# from the commit it measures.
#
# Build shape (the owner's from-source law, night-dragon-maintenance-2):
# the pty, soak, and torture legs build the pro-linux-amd64-v3-musl
# alias - the release-page amd64-v3 static musl shape
# (night-dragon-maintenance-6), never a bare `cargo build --release` -
# so the binary the battery exercises is a binary the release ships.
# The alias carries the profile, the COSMOSTRIX_BUILD/PROFILE labels
# and the target triple; the rustflags ride the step-level RUSTFLAGS
# env because cargo precedence gives RUSTFLAGS env shadow over the
# alias's build.rustflags config (the ci.yml v80 contract: a job that
# overrides RUSTFLAGS MUST re-add -D warnings - here it also carries
# the alias's exact -C target-cpu token). The runner CPU exposes
# x86-64-v3 (AVX2), so the pin is safe; every Linux leg in this
# workflow now rides the static musl alias family
# (night-dragon-maintenance-6), including the VM lanes in
# supermassive-kernel.yml.
#
# night-T-1 (the owner's five-minute law, 2026-11-11): the owner
# waiting 30 minutes on one CI run is a burden, so the workflow is
# restructured around a hard per-job shape: every battery leg targets
# five minutes or less. The muscle that buys it is the artifact
# relay - one build_musl job compiles the release shape ONCE (the
# same from-source law: the named alias, --locked, the step-level
# RUSTFLAGS contract), uploads the binary, and every leg downloads
# it; the musl workspace suite compiles once into a cargo nextest
# archive and executes as four parallel shards; the soak render is
# trimmed 300 s -> 240 s so the whole leg - download, render,
# ceiling check - fits the five-minute target with headroom (the
# dataset stays longitudinal; the anti-runaway RSS ceiling is
# unchanged and the calibration read a flat 9.5 MB RSS, two orders
# of magnitude under it).
#
# night-T-1 completion (the thirty-minute retirement): the last job
# above the law was musl_compile, whose 30-minute ceiling existed
# only because the test profile inherits full debuginfo from dev.
# The job now compiles with -C debuginfo=line-tables-only and
# CARGO_INCREMENTAL=0 - CI-only levers, the local dev profile keeps
# its full debuginfo - which cuts the bulk of the cold codegen and
# link time and shrinks the nextest archive the four shards
# download. Its ceiling drops 30 -> 12 (the same cold ceiling the
# release compile carries), musl_shards drops 10 -> 5, and every
# job in this file now targets five minutes with an honest tail.
#
# Budgets: build_musl 12 min (the one compile; its cold-cache
# ceiling - warm-cache runs land well under the five-minute target),
# pty_smoke 5 min, torture 5 min, soak 6 min (a 240 s render plus
# the artifact download and the ceiling check; the target is five),
# musl_compile 12 min (the one test compile; line-tables-only
# retired the full-debuginfo bulk that used to push the cold ceiling
# to 30 - the thirty-minute job the owner refused to wait on no
# longer exists), musl_shards 5 min each (the target and the ceiling
# now agree - the shards' execution windows measure in seconds and
# even a cold archive download fits). The pty driver
# carries its own internal watchdog (--budget) so a wedged child can
# never outlive the job's outer timeout - the same wedge-guard
# relationship the zelynic envelopes keep between VM budget and job
# budget.
#
# Every step below rides the owner's retry contract where it touches
# the network (apt), and the dependency-version policy resolves
# tools at run time (no hardcoded third-party versions).
#
# =============================================================================

name: Cosmic Dragon Guard - Supermassive

'on':
  push:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_VERSION: "1.98.1"
  RUSTFLAGS: "-D warnings"

jobs:
  # night-T-1 (the owner's five-minute law, 2026-11-11): the battery
  # legs no longer each pay a cold musl compile. One job builds the
  # release shape once - the same from-source law as before: the named
  # pro-linux-amd64-v3-musl alias, --locked, the step-level RUSTFLAGS
  # carrying -D warnings and the alias's exact -C target-cpu token -
  # and every leg below downloads that artifact. The compile is the
  # one long pole of the workflow (the cold-cache ceiling below;
  # warm-cache runs land well under the owner's five-minute target).
  #
  # night-arm64-1 (the owner's arm-server law, 2026-11-11): the shape
  # is now a two-arch matrix. The aarch64 leg builds the fully static
  # musl release shape on ubuntu-24.04-arm (GitHub's Ubuntu Server
  # ARM64 host - the modern arm-server support the owner asked for;
  # the aarch64-musl target's rust-lld linker is already wired in
  # .cargo/config.toml, and the .cargo alias comment blesses the plain
  # release build for aarch64 hosts). Its binary is exercised ON the
  # real ARM CPU by the pty smoke legs below.
  build_musl:
    name: supermassive build - pro-musl (the release shape, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # The x86_64 battery shape - unchanged artifact contract:
          # the kernel lanes and the soak/torture legs download this
          # exact name.
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            build_cmd: cargo pro-linux-amd64-v3-musl --locked
            rustflags: "-D warnings -C target-cpu=x86-64-v3"
            bin_tail: pro-linux-amd64-v3-musl/cosmostrix
            artifact: cosmostrix-pro-v3-musl
          # The arm64 server shape (night-arm64-1): same release
          # profile, no target-cpu pin (the arm-server audience runs
          # everything from Neoverse N1 to Graviton), artifact name
          # distinct so the x86_64 consumers stay byte-identical.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            build_cmd: cargo build --release --locked --target aarch64-unknown-linux-musl
            rustflags: "-D warnings"
            bin_tail: release/cosmostrix
            artifact: cosmostrix-pro-musl-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # night-dragon-maintenance-6: the battery binary is the static
      # musl release shape; the musl-gcc wrapper covers the target's
      # linker needs on the shared runner.
      - name: Install musl tools
        run: |
          set -euo pipefail
          # NIGHT-dinner-1: apt rides its own retry knob - a flaky
          # mirror fetch must not read as a code failure.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo timeout 120 apt-get -o Acquire::Retries=8 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update
          sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo timeout 120 apt-get -o Acquire::Retries=8 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y musl-tools

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build the pro-musl binary (the release shape, ${{ matrix.arch }})
        # Step-level RUSTFLAGS (workflow-level -D warnings is
        # shadowed here on purpose): carries the alias's exact -C
        # token, which RUSTFLAGS env would otherwise drop (env
        # shadows build.rustflags). Per-arch command and flags ride
        # the matrix (night-arm64-1).
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: ${{ matrix.build_cmd }}

      - name: Upload the battery binary
        # upload-artifact does not preserve the exec bit; every
        # consumer restores it after download.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/${{ matrix.bin_tail }}
          if-no-files-found: error

  pty_smoke:
    name: supermassive test - pty smoke (quit paths and color tiers, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [build_musl]
    timeout-minutes: 5
    # night-arm64-1: the same six pty legs run the aarch64 battery
    # binary on the real ARM CPU (ubuntu-24.04-arm, Ubuntu Server
    # ARM64) - the arm-server lane proves the quit paths and the
    # color-tier downgrades are arch-independent.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            artifact: cosmostrix-pro-v3-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: cosmostrix-pro-musl-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built battery binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/mass-bin

      # upload-artifact does not preserve the exec bit; the consumers
      # restore it after download.
      - name: Restore the exec bit
        run: chmod 755 /tmp/mass-bin/cosmostrix

      - name: Quit paths under a real pty
        run: |
          set -euo pipefail
          BINARY="/tmp/mass-bin/cosmostrix"
          MASS="/tmp/mass-pty.log"
          rm -f "${MASS}"
          SMOKE=scripts/supermassive/pty_smoke.py
          ASSERT=scripts/supermassive/pty_assert.py

          # Leg 1 - the --duration deadline exit (the bounded-run contract).
          python3 "${SMOKE}" --binary "${BINARY}" \
            --log /tmp/smoke-duration.log --mass "${MASS}" \
            --label duration-5s --arg=--duration --arg=5 \
            --env=TERM=xterm-256color --budget 25
          python3 "${ASSERT}" --log /tmp/smoke-duration.log --mass "${MASS}" \
            --label duration-5s \
            --expect alt-enter --expect alt-leave --expect mouse-off \
            --expect paste-off --expect focus-off --forbid sgr-truecolor

          # Leg 2 - the 'q' quit key delivered as live tty input bytes.
          python3 "${SMOKE}" --binary "${BINARY}" \
            --log /tmp/smoke-qkey.log --mass "${MASS}" \
            --label quit-key-5s --env=TERM=xterm-256color \
            --quit-key 5 --budget 25
          python3 "${ASSERT}" --log /tmp/smoke-qkey.log --mass "${MASS}" \
            --label quit-key-5s \
            --expect alt-enter --expect alt-leave --expect mouse-off \
            --forbid sgr-truecolor

          # Leg 3 - SIGTERM graceful shutdown (the signal_handlers contract;
          # SIGINT is deliberately not a quit signal since the bug-15 fix).
          python3 "${SMOKE}" --binary "${BINARY}" \
            --log /tmp/smoke-sigterm.log --mass "${MASS}" \
            --label sigterm-5s --env=TERM=xterm-256color \
            --sigterm 5 --budget 25
          python3 "${ASSERT}" --log /tmp/smoke-sigterm.log --mass "${MASS}" \
            --label sigterm-5s \
            --expect alt-leave --expect mouse-off --forbid sgr-truecolor

      - name: Color tier downgrade battery
        run: |
          set -euo pipefail
          # The alias-built release shape (the same binary the other
          # legs exercise) - downloaded from the build_musl artifact.
          BINARY="/tmp/mass-bin/cosmostrix"
          MASS="/tmp/mass-pty.log"
          SMOKE=scripts/supermassive/pty_smoke.py
          ASSERT=scripts/supermassive/pty_assert.py

          # Leg 4 - NO_COLOR: grayscale indexed output only, chromatic
          # direct-color forbidden, full restore tail still emitted.
          python3 "${SMOKE}" --binary "${BINARY}" \
            --log /tmp/smoke-nocolor.log --mass "${MASS}" \
            --label no-color-4s --arg=--duration --arg=4 \
            --env=TERM=xterm-256color --env=NO_COLOR=1 --budget 25
          python3 "${ASSERT}" --log /tmp/smoke-nocolor.log --mass "${MASS}" \
            --label no-color-4s \
            --expect alt-leave --expect mouse-off --forbid sgr-truecolor

          # Leg 5 - TERM=dumb: the strongest downgrade, no color and no
          # alternate screen at all, restore-without-alt-screen still runs.
          python3 "${SMOKE}" --binary "${BINARY}" \
            --log /tmp/smoke-dumb.log --mass "${MASS}" \
            --label term-dumb-4s --arg=--duration --arg=4 \
            --env=TERM=dumb --budget 25
          python3 "${ASSERT}" --log /tmp/smoke-dumb.log --mass "${MASS}" \
            --label term-dumb-4s \
            --expect mouse-off --forbid sgr-truecolor --forbid sgr-256 \
            --forbid alt-enter --forbid alt-leave

          # Leg 6 - TERM=xterm: the 16-color tier, indexed and direct
          # color both forbidden.
          python3 "${SMOKE}" --binary "${BINARY}" \
            --log /tmp/smoke-xterm16.log --mass "${MASS}" \
            --label xterm-16-4s --arg=--duration --arg=4 \
            --env=TERM=xterm --budget 25
          python3 "${ASSERT}" --log /tmp/smoke-xterm16.log --mass "${MASS}" \
            --label xterm-16-4s \
            --expect alt-leave --expect mouse-off \
            --forbid sgr-truecolor --forbid sgr-256

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-pty.log"
          echo "--- MASS-RESULT relay (pty smoke) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: all six pty legs restored the terminal and exited clean"

      - name: Watch summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - pty smoke"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo '```'
            cat /tmp/mass-pty.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # The workspace test battery, the night-T-1 shape: one compile (the
  # unavoidable pole - a cold musl compile of the whole workspace),
  # then four execution shards that download the nextest archive and
  # each fit the owner's five-minute target. cargo nextest archive
  # compiles the same test binaries the old in-job run compiled (the
  # unit tree, the proptest battery, the safepath floors); the shards
  # split EXECUTION only - the same partition contract ci.yml's
  # test_partitions matrix rides. --retries 1 keeps the 486
  # timing-sensitive tests honest on a loaded shared runner, exactly
  # like the musl gate leg in the release lane. night-T-1 completion:
  # the compile pole itself shrank - line-tables-only retired the
  # full-debuginfo bulk, so the ceiling no longer needs the old
  # thirty-minute headroom.
  musl_compile:
    name: supermassive build - musl nextest archive (the one compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl

      - name: Install musl cross tools
        run: |
          set -euo pipefail
          sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo timeout 120 apt-get -o Acquire::Retries=8 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq
          sudo sed -i 's|azure\.archive\.ubuntu\.com|mirrors.edge.kernel.org|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo timeout 120 apt-get -o Acquire::Retries=8 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 install -y -qq musl-tools

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Unpinned on purpose (owner dependency policy 2026-08-30): the
      # latest upstream cargo-nextest release, same as ci.yml's test job.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build the musl test archive
        # night-T-1 completion: CI-only levers on top of the workflow
        # -D warnings gate. line-tables-only keeps panic backtraces
        # file-and-line precise while dropping the full-debuginfo
        # bulk (codegen time, link time, archive weight) that made
        # the cold compile a thirty-minute pole;
        # CARGO_INCREMENTAL=0 retires incremental churn a one-shot
        # CI compile never reads back. The local dev profile keeps
        # its full debuginfo - these levers live only here.
        env:
          RUSTFLAGS: "-D warnings -C debuginfo=line-tables-only"
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          cargo nextest archive --workspace --locked \
            --target x86_64-unknown-linux-musl \
            --archive-file /tmp/musl-tests.tar.zst \
            --archive-format tar-zst

      - name: Upload the test archive
        # compression-level 0: the archive is already zstd-compressed;
        # double-compiling a multi-hundred-MB payload would only burn
        # the job budget the five-minute law is here to protect.
        uses: actions/upload-artifact@v7
        with:
          name: cosmostrix-musl-tests-archive
          path: /tmp/musl-tests.tar.zst
          compression-level: 0
          if-no-files-found: error

  musl_shards:
    name: supermassive test - musl nextest shard ${{ matrix.partition }}/4
    runs-on: ubuntu-24.04
    needs: [musl_compile]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Tunable: four shards keep every shard's EXECUTION window
        # inside the owner's five-minute target (partitioning splits
        # execution, not compilation - the compile happened once
        # above). night-T-1 completion: the ceiling now matches the
        # target - checkout, the nextest install, and the archive
        # download all fit inside it, so the five-minute law holds
        # end to end.
        partition: [1, 2, 3, 4]
    steps:
      # The archive carries the test binaries and their data, but
      # nextest still resolves the workspace root baked into the
      # archive metadata (build-script reuse) - the shard failure on
      # 2026-11-11 was "workspace root manifest ... does not exist" -
      # and one test reads the source tree at runtime through
      # CARGO_MANIFEST_DIR. A shallow checkout of the same commit at
      # the same default path satisfies both without paying a compile.
      - name: Check out the source under test
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain (cargo for the nextest invocation)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download the test archive
        uses: actions/download-artifact@v8
        with:
          name: cosmostrix-musl-tests-archive
          path: /tmp/mass-tests

      - name: Tests (nextest shard under musl)
        run: |
          set -euo pipefail
          MASS="/tmp/mass-musl.log"
          rm -f "${MASS}"
          if cargo nextest run \
            --archive-file /tmp/mass-tests/musl-tests.tar.zst \
            --partition count:${{ matrix.partition }}/4 --retries 1; then
            echo "MASS-RESULT: musl-shard-${{ matrix.partition }} exit=0" >> "${MASS}"
          else
            echo "MASS-RESULT: musl-shard-${{ matrix.partition }} FAIL" >> "${MASS}"
          fi

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-musl.log"
          echo "--- MASS-RESULT relay (musl nextest shard ${{ matrix.partition }}) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: shard ${{ matrix.partition }} of the workspace suite passes under the shipped musl libc"

      - name: Watch summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - musl nextest shard ${{ matrix.partition }}"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo '```'
            cat /tmp/mass-musl.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  soak:
    name: supermassive test - render soak (memory watch)
    runs-on: ubuntu-24.04
    needs: [build_musl]
    timeout-minutes: 5
    # night-improve-10 (owner decision): no event gate. The old
    # schedule-only if rendered this job as a "(push) Skipped" row
    # on every code commit; now every qualifying push produces its
    # own dataset row in the step summary.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built battery binary
        uses: actions/download-artifact@v8
        with:
          name: cosmostrix-pro-v3-musl
          path: /tmp/mass-bin

      # upload-artifact does not preserve the exec bit; the consumers
      # restore it after download.
      - name: Restore the exec bit
        run: chmod 755 /tmp/mass-bin/cosmostrix

      # A 240 s render with VmRSS sampled every 10 s. night-T-1
      # trimmed the window 300 s -> 240 s so the whole leg - artifact
      # download, render, ceiling check - fits the owner's
      # five-minute target; the dataset stays longitudinal and the
      # anti-runaway ceiling is unchanged. The driver's --budget
      # watchdog (270 s) stays wider than the render deadline so the
      # deadline exit always wins, and narrower than the job timeout
      # so a wedged guest can never burn the job budget.
      - name: Render soak under a real pty
        run: |
          set -euo pipefail
          MASS="/tmp/mass-soak.log"
          rm -f "${MASS}"
          python3 scripts/supermassive/pty_smoke.py \
            --binary /tmp/mass-bin/cosmostrix \
            --log /tmp/soak-render.log --mass "${MASS}" \
            --label soak-240s --arg=--duration --arg=240 \
            --env=TERM=xterm-256color \
            --rss-log /tmp/soak-rss.log --rss-interval 10 \
            --budget 270

      # The bound is an anti-runaway ceiling, not a performance claim:
      # the local calibration read a flat 9.5 MB RSS on a 25 s debug
      # run, so any healthy build passes with two orders of magnitude
      # of headroom. The per-push step summaries are the dataset.
      - name: Memory bound check
        run: |
          set -euo pipefail
          MASS="/tmp/mass-soak.log"
          PEAK_KB="$(sed -n 's/.*rss_peak_kb=\([0-9]*\).*/\1/p' "${MASS}" | head -1)"
          if [ -z "${PEAK_KB}" ]; then
            echo "MASS-RESULT: soak-240s FAIL reason=no rss peak row" >> "${MASS}"
          elif [ "${PEAK_KB}" -gt 1500000 ]; then
            echo "MASS-RESULT: soak-240s FAIL reason=rss peak ${PEAK_KB} kB over the 1.5 GB ceiling" >> "${MASS}"
          else
            echo "MASS-RESULT: soak-240s rss ceiling PASS (peak ${PEAK_KB} kB)" >> "${MASS}"
          fi

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-soak.log"
          echo "--- MASS-RESULT relay (soak) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: the 240 s render stayed inside the memory ceiling"

      - name: Watch summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - render soak"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### RSS samples (the growth curve)"
            echo
            echo '```'
            cat /tmp/soak-rss.log
            echo '```'
            echo
            echo "### relay rows"
            echo
            echo '```'
            cat /tmp/mass-soak.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # night-dragon-maintenance-4 (owner directive): the brutal
  # server-simulation leg. pty_smoke proves the quit contracts on a
  # quiet bench; torture proves them UNDER ATTACK - resize hammering,
  # an input flood, a signal storm (SIGINT deliberately not a quit
  # signal, the bug-15 contract, then a graceful SIGTERM), a
  # live-reload config churn mixing valid and type-broken edits, and
  # twelve randomized-size restart sessions. Same sentinel relay
  # grammar: every checked fact lands a MASS-RESULT row; the Verdict
  # fails on any FAIL row.
  torture:
    name: supermassive test - hostile server torture
    runs-on: ubuntu-24.04
    needs: [build_musl]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built battery binary
        uses: actions/download-artifact@v8
        with:
          name: cosmostrix-pro-v3-musl
          path: /tmp/mass-bin

      # upload-artifact does not preserve the exec bit; the consumers
      # restore it after download.
      - name: Restore the exec bit
        run: chmod 755 /tmp/mass-bin/cosmostrix

      - name: Run the hostile torture battery
        run: |
          set -euo pipefail
          MASS="/tmp/mass-torture.log"
          rm -f "${MASS}"
          python3 scripts/supermassive/torture.py \
            --binary /tmp/mass-bin/cosmostrix \
            --mass "${MASS}" \
            --workdir /tmp/cosmostrix-torture

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-torture.log"
          echo "--- MASS-RESULT relay (torture) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: the renderer held its contracts under every hostile leg"

      - name: Torture summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - hostile torture"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### relay rows"
            echo
            echo '```'
            cat /tmp/mass-torture.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
