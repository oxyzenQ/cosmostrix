          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: the renderer held its contracts under every hostile leg"

      - name: Torture summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - hostile torture"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### relay rows"
            echo
            echo '```'
            cat /tmp/mass-torture.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # night-frontier-Z2 Kernel Floor 2a (the owner's directive): the
  # "single-syscall flush" claim stops being a document and becomes a
  # kernel-measured CI invariant. The release-shape binary runs under
  # strace on a real pty; scripts/supermassive/syscall_floor.py parses
  # the kernel trace and asserts:
  #   - exactly ONE write() syscall per drawn frame, proven by the
  #     sync-marker fingerprint (the ONLY writer of ESC[?2026h is the
  #     combined flush buffer) against the --perf-stats frames_flushed
  #     count - the renderer's own ledger of flush_ansi() calls;
  #   - byte-exact identity: the sum of kernel frame-write lengths
  #     equals total_ansi_bytes + 16 sync-wrapper bytes per frame;
  #   - zero failed writes, zero short (frame-splitting) writes, and
  #     no BufWriter spillover at the pinned 80x24 screen;
  #   - the io_uring rejection record, free with the proof: the
  #     steady state is 1 write()/frame = the kernel floor for a tty
  #     writer, so io_uring for a single write is pure overhead -
  #     rejected, record stands (the measured-cost benchmark lives in
  #     src/cosmic_dragon_incubator/egg/io_uring_rejected.rs).
  # strace is Linux-only by definition, so the ledger rides the
  # x86_64 release shape (the same binary the release page ships);
  # the aarch64 lane shares the kernel syscall contract, not the
  # ptrace tool. The apt fallback rides the owner's retry contract in
  # case a future runner image drops preinstalled strace.
  syscall_floor:
    name: supermassive test - syscall floor ledger (the kernel floor)
    runs-on: ubuntu-24.04
    needs: [build_musl]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built battery binary
        uses: actions/download-artifact@v8
        with:
          name: cosmostrix-pro-v3-musl
          path: /tmp/mass-bin

      # upload-artifact does not preserve the exec bit; the consumers
      # restore it after download.
      - name: Restore the exec bit
        run: chmod 755 /tmp/mass-bin/cosmostrix

      # strace is preinstalled on the ubuntu-24.04 runner image; the
      # fallback keeps the leg honest if that ever changes. Retry
      # contract for the network touch, per the workflow header.
      - name: Ensure strace
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y strace; then
                break
              fi
              echo "apt attempt ${attempt} failed; retrying" >&2
              sleep 5
            done
          fi
          strace -V

      - name: Run the syscall-floor ledger under strace
        run: |
          set -euo pipefail
          MASS="/tmp/mass-syscall.log"
          rm -f "${MASS}"
          python3 scripts/supermassive/syscall_floor.py \
            --binary /tmp/mass-bin/cosmostrix \
            --trace /tmp/sf-trace.log \
            --log /tmp/sf-capture.log \
            --mass "${MASS}" \
            --label syscall-floor-8s \
            --duration 8 \
            --budget 30

      # The kernel trace is the dataset row: uploaded on every run so a
      # residual (if the ledger ever trips) is analyzable from the raw
      # strace output, not reconstructed from summaries.
      - name: Upload the kernel trace (the dataset row)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: syscall-floor-trace-${{ github.run_id }}
          path: |
            /tmp/sf-trace.log
            /tmp/sf-capture.log
          if-no-files-found: ignore

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-syscall.log"
          echo "--- MASS-RESULT relay (syscall floor) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: the kernel proves 1 write() syscall per drawn frame - the floor holds"

      - name: Syscall floor summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - syscall floor ledger"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### relay rows"
            echo
            echo '```'
            cat /tmp/mass-syscall.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # night-frontier-Z9, Kernel Floor 2d: the whole-frame wakeup budget.
  # The syscall-floor ledger (2a) proved the output floor and left the
  # wait/timer vocabulary untraced by design; this leg closes that
  # residue. It pins the render thread's measured per-frame budget -
  # one blocking wait, one bounded zero-timeout probe, one write, zero
  # sleeps, zero yields, zero input reads, /proc telemetry at its
  # named cadence, the watchdog's 1 Hz ledgered informationally - so
  # a busy loop, a stray sleep, an input-read storm, or a wait
  # mechanism swap fails CI with the kernel counts in the message.
  wakeup_floor:
    name: supermassive test - wakeup floor ledger (the whole-frame budget)
    runs-on: ubuntu-24.04
    needs: [build_musl]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built battery binary
        uses: actions/download-artifact@v8
        with:
          name: cosmostrix-pro-v3-musl
          path: /tmp/mass-bin

      # upload-artifact does not preserve the exec bit; the consumers
      # restore it after download (the syscall_floor precedent).
      - name: Restore the exec bit
        run: chmod 755 /tmp/mass-bin/cosmostrix

      # strace is preinstalled on the ubuntu-24.04 runner image; the
      # fallback keeps the leg honest if that ever changes. Retry
      # contract for the network touch, per the workflow header.
      - name: Ensure strace
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y strace; then
                break
              fi
              echo "apt attempt ${attempt} failed; retrying" >&2
              sleep 5
            done
          fi
          strace -V

      - name: Run the wakeup-floor ledger under strace
        run: |
          set -euo pipefail
          MASS="/tmp/mass-wakeup.log"
          rm -f "${MASS}"
          python3 scripts/supermassive/wakeup_budget.py \
            --binary /tmp/mass-bin/cosmostrix \
            --trace /tmp/wf-trace.log \
            --log /tmp/wf-capture.log \
            --mass "${MASS}" \
            --label wakeup-floor-8s \
            --duration 8 \
            --budget 30

      # The kernel trace is the dataset row: uploaded on every run so a
      # residual (if the ledger ever trips) is analyzable from the raw
      # strace output, not reconstructed from summaries.
      - name: Upload the kernel trace (the dataset row)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wakeup-floor-trace-${{ github.run_id }}
          path: |
            /tmp/wf-trace.log
            /tmp/wf-capture.log
          if-no-files-found: ignore

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-wakeup.log"
          echo "--- MASS-RESULT relay (wakeup floor) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: the kernel proves the whole-frame budget - one blocking wait, one bounded probe, one write, zero sleeps, zero yields per frame on the render thread"

      - name: Wakeup floor summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - wakeup floor ledger"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### relay rows"
            echo
            echo '```'
            cat /tmp/mass-wakeup.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # night-frontier-Z9-C: the emission-floor ledger - the runtime half of
  # the emission-minimality certificate. The INV-22 Rust certificate
  # binds the shipped diff solver to the law reference in-process; this
  # leg runs the release-shape binary on a real pty, splits the captured
  # stream into the synchronized frames the combined flush writes, and
  # asserts the emission identity (bytes >= payload + bridges + reset)
  # on every real frame, the trailing-reset structure on every frame,
  # and the calibrated overhead bands. Teeth by injection: a bloated
  # synthetic frame and a reset-less synthetic frame must both FAIL the
  # same checker. No strace: the ledger reads the emitted bytes, not
  # the kernel.
  emission_floor:
    name: supermassive test - emission floor ledger (the stream identity)
    runs-on: ubuntu-24.04
    needs: [build_musl]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the built battery binary
        uses: actions/download-artifact@v8
        with:
          name: cosmostrix-pro-v3-musl
          path: /tmp/mass-bin

      # upload-artifact does not preserve the exec bit; the consumers
      # restore it after download (the syscall_floor precedent).
      - name: Restore the exec bit
        run: chmod 755 /tmp/mass-bin/cosmostrix

      - name: Run the emission-floor ledger on a real pty
        run: |
          set -euo pipefail
          MASS="/tmp/mass-emission.log"
          rm -f "${MASS}"
          python3 scripts/supermassive/emission_floor.py \
            --binary /tmp/mass-bin/cosmostrix \
            --log /tmp/ef-capture.log \
            --mass "${MASS}" \
            --label emission-floor-8s \
            --duration 8 \
            --budget 30

      # The pty capture is the dataset row: uploaded on every run so a
      # residual (if the ledger ever trips) is analyzable from the raw
      # stream, not reconstructed from summaries.
      - name: Upload the pty capture (the dataset row)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emission-floor-capture-${{ github.run_id }}
          path: /tmp/ef-capture.log
          if-no-files-found: ignore

      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          MASS="/tmp/mass-emission.log"
          echo "--- MASS-RESULT relay (emission floor) ---"
          cat "${MASS}"
          if [ ! -f "${MASS}" ] || grep -q 'FAIL' "${MASS}"; then
            echo "MASS-VERDICT: FAIL"
            exit 1
          fi
          echo "MASS-VERDICT: PASS"
          echo "OK: the real stream proves the emission identity - every frame carries at least its changed cells' payload, the style bridges, and the reset, inside the calibrated overhead bands"

      - name: Emission floor summary (the longitudinal dataset row)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Supermassive watch - emission floor ledger"
            echo
            echo "- trigger: ${{ github.event_name }}"
            echo "- run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo
            echo "### relay rows"
            echo
            echo '```'
            cat /tmp/mass-emission.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
