name: Cosmic Dragon - Docs CI

'on':
  push:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'
      - 'NOTICE'
      - 'AUTHORS'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'
      - 'NOTICE'
      - 'AUTHORS'

permissions:
  contents: read

jobs:
  lint:
    name: Docs Spelling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install codespell
        run: python3 -m pip install --user codespell

      - name: Check documentation files
        run: |
          if [ -f .codespellrc ]; then
            find . -type f \( -name '*.md' -o -name '*.txt' -o -name '*.rst' \) -print0 \
              | xargs -0r codespell --config .codespellrc
          else
            find . -type f \( -name '*.md' -o -name '*.txt' -o -name '*.rst' \) -print0 \
              | xargs -0r codespell
          fi
