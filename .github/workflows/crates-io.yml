#
# Cosmic Dragon Release - crates.io publish.
#
# Publishes cosmostrix to crates.io on EVERY owner-pushed release tag -
# stable (vX.Y.Z) and pre-release (vX.Y.Z-<suffix>, the hyphen in the
# version makes it a pre-release — e.g. vX.Y.Z-beta.1, vX.Y.Z-example.1)
# both trigger the publish, so the registry never lags behind a
# GitHub Release.
#
# One-time setup (owner): create a crates.io API token
# (crates.io -> Account Settings -> API Tokens, "publish-new" scope is
# enough) and add it as the CRATES_IO_TOKEN repository secret
# (repo Settings -> Secrets and variables -> Actions).
#
# Safety properties:
#   - Fails fast if the tag does not match Cargo.toml's version.
#   - Idempotent: if the version is already published (re-pushed tag or
#     re-run), the job skips the upload instead of failing.
#   - --locked: the published dependency set is exactly the tagged
#     Cargo.lock, the same tree every other CI job validated.
#
# Dependency version policy: actions float on major tags and the Rust
# toolchain is LTS-locked via rust-toolchain.toml (single source of
# truth; gate 9 keeps the RUST_VERSION env in sync). See
# docs/workflow/ABOUT_CI.md (Dependency version policy).

name: Cosmic Dragon Release - crates.io publish

'on':
  push:
    tags:
      # Stable releases (v51.0.0) ...
      - 'v*.*.*'
      # ... and pre-releases (any vX.Y.Z-<suffix> tag — the hyphen in
      # the version is the classifier, no channel enumeration).
      - 'v*.*.*-*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Single source of truth for Rust toolchain version.
  # Keep in sync with rust-toolchain.toml + Cargo.toml rust-version.
  RUST_VERSION: "1.98.1"

jobs:
  # NIGHT-improve-1: the same commit+tag collision gate release.yml
  # carries. When the release commit and its tag are pushed together,
  # this publish used to race the branch CI on the same SHA — and a
  # crates.io publish is IRREVERSIBLE (a bad version can only be
  # yanked, never replaced). The gate waits for the ci.yml push-run on
  # the exact tagged SHA and requires conclusion=success before the
  # upload. Full contract: scripts/ci/wait-for-ci.sh.
  ci_gate:
    name: CI gate (commit+tag push)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      # The wait itself only needs run listings + the checkout
      # (actions: read / contents: read); the NIGHT-dinner-1 infra
      # carve-out additionally requests re-runs of infra-signatured
      # failed runs (actions: write — the job's ephemeral github.token
      # can re-run this repo's CI and nothing else).
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ci-gate tools (every seat installs its own)
        shell: bash
        run: |
          set -euo pipefail
          # night-dragon-maintenance-7 (zelynic night-dragon-maintenance-10
          # lineage): this job runs wait-for-ci.sh OUTSIDE the wholesale
          # cosmic-dragon-guard seat - the exact geometry that killed
          # zelynic v80.0.1-night.1, where one publish lane trusted the
          # runner image's apt set and died in fourteen seconds on the
          # first tag that stepped on the gap. curl and jq are runner
          # staples today; the law is that this seat installs what it
          # runs instead of trusting the image. wait-for-ci.sh fail-closes
          # on a missing tool, so this census pays the seat's own bill
          # before the gate asks for it.
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=5 update -qq
            sudo apt-get -o Acquire::Retries=5 install -y -qq jq
          fi
          jq --version

      - name: Wait for the branch CI on the tagged commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait-for-ci.sh

  publish-crates-io:
    name: Publish to crates.io (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    needs: ci_gate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION} - bump with ./scripts/dev/version-to.sh before tagging."
            exit 1
          fi
          echo "Publishing cosmostrix ${CARGO_VERSION} to crates.io"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN repository secret is not set."
            echo "Create a crates.io API token (crates.io -> Account Settings -> API Tokens)"
            echo "and add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # Idempotency probe: crates.io rejects duplicate versions, so a
          # re-pushed tag (or a re-run) must not attempt a second upload.
          # The API requires a custom User-Agent (plain curl gets 403).
          # NIGHT-dinner-1: the probe rides the curl retry contract — a
          # flaky 5xx answer otherwise reads "not published", falls
          # through to cargo publish, and dies as a duplicate-version
          # error: an infra flake perfectly disguised as a code failure.
          if curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 -A "cosmostrix-ci-publish-check" \
              "https://crates.io/api/v1/crates/cosmostrix/${VERSION}" >/dev/null 2>&1; then
            echo "cosmostrix ${VERSION} is already published on crates.io - nothing to do."
            exit 0
          fi
          cargo publish --locked

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
