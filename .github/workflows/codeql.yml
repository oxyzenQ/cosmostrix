# CodeQL security analysis for cosmostrix.
#
# Auto-detects all languages in the repository and runs CodeQL analysis
# for each. No hardcoded language list — future-proof.
#
# Detection strategy:
#   1. Scan repo for file extensions: .rs, .py, .js, .ts, .sh, .go, etc.
#   2. Check language markers: Cargo.toml, pyproject.toml, package.json, etc.
#   3. Install toolchains for compiled languages (Rust, Go) conditionally.
#   4. CodeQL init with no `languages` input → auto-detect from repo.
#
# Note: CodeQL supports C/C++, C#, Go, Java, JS/TS, Python, Ruby, Rust,
# Swift. Bash/shell is NOT a CodeQL language — but .sh changes still
# trigger this workflow (path filter) so shellcheck in ci.yml covers them.
#
# Weekly scheduled scan Monday 03:00 UTC for full coverage.

name: CodeQL

'on':
  push:
    branches: ["main"]
    paths:
      # Rust
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      # Shell scripts
      - 'scripts/**'
      - '*.sh'
      # Python
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'setup.py'
      - '*.py'
      # JavaScript / TypeScript
      - 'package.json'
      - '*.js'
      - '*.ts'
      # Go
      - 'go.mod'
      - '*.go'
      # C/C++
      - 'Makefile'
      - 'CMakeLists.txt'
      - '*.c'
      - '*.h'
      - '*.cpp'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/**'
      - '*.sh'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'setup.py'
      - '*.py'
      - 'package.json'
      - '*.js'
      - '*.ts'
      - 'go.mod'
      - '*.go'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '*.c'
      - '*.h'
      - '*.cpp'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_VERSION: "1.97.1"

jobs:
  detect-languages:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      detected: ${{ steps.detect.outputs.detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Detect languages from repo
        id: detect
        run: |
          HAS_RUST="false"
          DETECTED=""

          # ── Rust ──
          if [ -f "Cargo.toml" ] || find . -maxdepth 3 -name "*.rs" -print -quit 2>/dev/null | grep -q .; then
            HAS_RUST="true"
            DETECTED="${DETECTED}rust,"
            echo "::notice::Rust detected"
          fi

          # ── Python ──
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ] || \
             find . -maxdepth 3 -name "*.py" -print -quit 2>/dev/null | grep -q .; then
            DETECTED="${DETECTED}python,"
            echo "::notice::Python detected"
          fi

          # ── JavaScript / TypeScript ──
          if [ -f "package.json" ] || \
             find . -maxdepth 3 \( -name "*.js" -o -name "*.ts" \) -print -quit 2>/dev/null | grep -q .; then
            DETECTED="${DETECTED}javascript,"
            echo "::notice::JavaScript/TypeScript detected"
          fi

          # ── Go ──
          if [ -f "go.mod" ] || find . -maxdepth 3 -name "*.go" -print -quit 2>/dev/null | grep -q .; then
            DETECTED="${DETECTED}go,"
            echo "::notice::Go detected"
          fi

          # ── C / C++ ──
          if [ -f "Makefile" ] || [ -f "CMakeLists.txt" ] || \
             find . -maxdepth 3 \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) -print -quit 2>/dev/null | grep -q .; then
            DETECTED="${DETECTED}cpp,"
            echo "::notice::C/C++ detected"
          fi

          # ── Shell (not a CodeQL language, but tracked for info) ──
          SHELL_COUNT=$(find . -maxdepth 3 -name "*.sh" 2>/dev/null | wc -l)
          if [ "$SHELL_COUNT" -gt 0 ]; then
            DETECTED="${DETECTED}shell(${SHELL_COUNT}),"
            echo "::notice::Shell scripts detected: ${SHELL_COUNT} files (covered by shellcheck in ci.yml)"
          fi

          # Trim trailing comma
          DETECTED="${DETECTED%,}"
          echo "has_rust=${HAS_RUST}" >> "$GITHUB_OUTPUT"
          echo "detected=${DETECTED}" >> "$GITHUB_OUTPUT"
          echo "::group::Detection summary"
          echo "Languages: ${DETECTED}"
          echo "has_rust:  ${HAS_RUST}"
          echo "::endgroup::"

  analyze:
    name: CodeQL Analyze
    needs: detect-languages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Install Rust toolchain only if Rust is detected.
      - name: Install Rust toolchain
        if: needs.detect-languages.outputs.has_rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Rust cache
        if: needs.detect-languages.outputs.has_rust == 'true'
        uses: Swatinem/rust-cache@v2.9.1
        with:
          cache-on-failure: true

      - name: Report detected languages
        run: |
          echo "CodeQL will auto-detect and analyze: ${{ needs.detect-languages.outputs.detected }}"
          echo "Shell scripts (.sh) are not a CodeQL language — covered by shellcheck in ci.yml."

      # CodeQL auto-detect: no `languages` input → scans all CodeQL-supported
      # languages found in the repo. Adding any new language = zero changes.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: .github/codeql/codeql-config.yml

      - name: Build (autobuild)
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /auto-detect
          upload: true
