#
# Dedicated CI for all .github/ workflow and config changes.
# Triggers on ANY modification under .github/ to ensure every workflow
# file is validated through yamllint and actionlint.
#
# Separated from ci.yml (source code CI) for strict path isolation:
# - ci.yml                  → src/**, Cargo.*, scripts/*, etc.
# - workflow-ci.yml        → .github/** only (actionlint + yamllint)
# - cosmic-dragon-guard.yml → gate-keepers.sh (shellcheck, markdownlint, codespell, SPDX, LOC, version sync)
# - miri.yml                → src/** (weekly + push)
# - codeql.yml              → src/** + scripts + other langs
# - release.yml             → tags only (v*)
# - maintenance.yml         → scheduled + manual
#
# This guarantees workflow changes never slip through unvalidated.

name: Cosmic Dragon Guard - Workflow CI

'on':
  push:
    branches: ["main"]
    paths:
      - '.github/**'
  pull_request:
    branches: ["main"]
    paths:
      - '.github/**'

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workflow_lint:
    name: Cosmic Dragon Guard - Workflow Lint (actionlint + yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: |
          python3 -m pip install --user yamllint
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

      - name: Run yamllint
        run: yamllint .github/workflows

  workflow_syntax:
    name: Cosmic Dragon Guard - Workflow Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate YAML syntax for all workflows
        run: |
          set -euo pipefail
          ERRORS=0
          for f in .github/workflows/*.yml; do
            echo "Validating: ${f}"
            python3 -c "import yaml; yaml.safe_load(open('${f}'))" 2>&1 || {
              echo "::error file=${f}::YAML syntax error in ${f}"
              ERRORS=$((ERRORS + 1))
            }
          done
          if [ "${ERRORS}" -gt 0 ]; then
            echo "::error::${ERRORS} workflow file(s) have YAML syntax errors"
            exit 1
          fi
          echo "All workflow files have valid YAML syntax"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
