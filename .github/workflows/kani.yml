#
# Kani - Bounded Model Checking (NIGHT-depth-hardening-3).
#
# The proven datapath: every proof harness lives under `#[cfg(kani)]`
# `kani_proofs` modules in the engine sources, and `cargo kani` verifies
# each one over EVERY symbolic input instead of sampling. The 15-minute
# law (night-depth-cleanup-2, the owner's micro-split rule — tightened
# from the 30-minute law): one harness per micro job, each job capped
# at 15 minutes - a future harness that inflates the run is isolated to
# its own job instead of hanging a monolithic lane, and the failing
# harness is named by the job title on the Actions tab. Measured
# 2026-11-20: each harness proves in ~1 minute, so 15 is pure ceiling.
#
# Harness roster (one job per harness; add a job when adding a harness):
#   - kani-cloud-density: living_rain density modifier band
#   - kani-cloud-reseed-ladder: the deterministic reseed ladder
#   - kani-chroma-blend: the chroma background blend hull
#   - kani-cloud-density-calibration: the calibration tooth (the false
#     bound that must REFUTE - the red path proven live, night-netrunner-Z2)

name: "Kani - Bounded Model Checking"

'on':
  push:
  # No schedule (night-fly-1, the owner's push-triggered law): the
  # proof rides every push; dispatch stays for manual verification.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  kani-cloud-density:
    name: Kani - cloud density band
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify density modifier band
        uses: model-checking/kani-github-action@v1
        with:
          runtime: 15
          args: --output-format terse --harness density_modifier_stays_in_band_for_any_input

  kani-cloud-reseed-ladder:
    name: Kani - reseed ladder totality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify reseed ladder
        uses: model-checking/kani-github-action@v1
        with:
          runtime: 15
          args: --output-format terse --harness reseed_ladder_is_total_and_fresh_per_rung

  kani-cloud-density-calibration:
    name: Kani - density calibration (must refute)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The calibration seat cannot use the kani-github-action: its
      # verdict follows the exit code, and the EXPECTED verdict here is
      # the verification failure. The same toolchain the action installs
      # (stable) and the same latest kani release, then the inverted
      # verdict is checked by hand: a refutation is the green path, and
      # every other outcome - the lie proven, no verdict, a crash - is
      # the red alarm that the tier's instrument is dead.
      - name: Install the stable toolchain and the kani verifier
        run: |
          rustup toolchain install stable --profile minimal
          cargo install --locked kani-verifier
          cargo kani setup

      - name: The calibration tooth must REFUTE (the red path proven live)
        run: |
          set -o pipefail
          if cargo kani --output-format terse --harness density_band_calibration_must_refute 2>&1 | tee kani_calibration.log; then
            echo "INSTRUMENT DEAD: a deliberately false law was PROVEN - the red path never fired"
            exit 1
          fi
          grep -qE "VERIFICATION:?-? FAILED" kani_calibration.log || {
            echo "NO VERDICT: kani died before reaching one (compile error or crash) - not the calibration red"
            exit 1
          }
          echo "THE RED PATH IS LIVE: the false law refuted with a concrete counterexample"

  kani-chroma-blend:
    name: Kani - chroma blend hull
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify background blend hull
        uses: model-checking/kani-github-action@v1
        with:
          runtime: 15
          args: --output-format terse --harness blend_toward_bg_rgb_stays_in_channel_hull

# night-zen-lts-2: join the estate-wide cancel-in-progress law (now
# estate-wide: every workflow carries it). These heavy lanes ran
# every push to completion, so a rapid push pair paid for two full
# model-checking sweeps with the first one discarded unread.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
