# CodeQL configuration for cosmostrix.
#
# Language-agnostic configuration. Suppresses false-positive alerts
# across all detected languages. cosmostrix is a terminal renderer —
# it has no cryptographic operations. Deterministic values used for
# rendering (char-pool seeds, phase selectors, palette indices) are
# not cryptographic secrets.
#
# When new languages are added to the repo, CodeQL auto-detects them
# and this config applies to all language packs uniformly.

name: cosmostrix-codeql-config

query-filters:
  # rust/hard-coded-cryptographic-value: fires on deterministic seed
  # values passed to char-pool index functions. These are rendering
  # parameters (which char pool variant to use), not cryptographic
  # secrets. Renamed from "salt" to "seed" to reduce heuristic matches,
  # and suppressed here as defense-in-depth.
  - exclude:
      id: rust/hard-coded-cryptographic-value
