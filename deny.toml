[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RUSTSEC-2024-0384 (`instant` unmaintained) — RESOLVED 2026-09-29 by
# the notify 7 -> 8 migration (NIGHT-dinner-5 follow-up): notify-types
# 2.x dropped `instant` entirely, the crate is no longer in the
# dependency graph, and the v50.0.0-beta.7-era ignore entry is retired.
# `cargo deny check advisories` now runs clean with no ignores.
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
unused-license-exception = "allow"
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
# Transitive dependency duplicates that cannot be resolved without upstream
# changes. These are caused by the dependency tree pulling in different
# major versions of the same crate through different paths:
#
# - windows-sys 0.60.2 (via notify v8) vs 0.61.2 (via ctrlc, rustix,
#   anstream, mio, etc.). Different minor versions of windows-sys —
#   notify v8 pins 0.60, the rest of the ecosystem uses 0.61.
#   Windows-only, transitive-only — it does not affect the cosmostrix
#   binary on Linux/macOS/FreeBSD at runtime. Skipping it here silences
#   the duplicate-versions warning without hiding real issues.
#
# v50.0.0-beta.7: removed mio 0.8.11 skip (notify 7 migrated to mio 1.x,
# eliminating the duplicate). Removed windows-sys 0.48.0 skip (was from
# the old mio 0.8 chain, no longer present).
#
# 2026-09-29 (notify 8 migration, NIGHT-dinner-5 follow-up): removed
# the bitflags 1.3.2 skip — notify 8 moved inotify to 0.11, which uses
# bitflags 2.x, so the bitflags 1.x duplicate is gone from the graph.
# Updated the windows-sys skip from 0.52.0 to 0.60.2 (notify 8's new
# floor).
skip = [
    { name = "windows-sys", version = "0.60.2" },
]
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
