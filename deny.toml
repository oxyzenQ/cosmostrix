[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# RUSTSEC-2024-0384 (`instant` unmaintained) — RESOLVED 2026-09-29 by
# the notify 7 -> 8 migration (NIGHT-dinner-5 follow-up): notify-types
# 2.x dropped `instant` entirely, the crate is no longer in the
# dependency graph, and the v50.0.0-beta.7-era ignore entry is retired.
# `cargo deny check advisories` now runs clean with no ignores.
ignore = []
# The 2026-08-20 arrayref attack shipped as a malicious republish
# (arrayref 0.3.10, live for 86 minutes, then yanked). A yanked
# version must never enter a build here, advisory or no advisory:
# yanked is deny, not warn.
yanked = "deny"
# Tier contract with the maintenance lane (night-solid-defense-1):
# advisory vulnerabilities are WARN here because the AXP1-ZnQ
# supply-chain verdict (scripts/ci/supplychain-verdict.py) owns the
# advisory verdict - a finding the sweep cleared stays non-blocking,
# a finding that survives the sweep exits 1 with a CALL OWNER banner.
# The hard vulnerability gates elsewhere are untouched: ci.yml and
# release.yml keep their own cargo audit lanes that fail on every
# advisory, and gitbot-audit.yml stays observation-only by design.
vulnerability = "warn"

[licenses]
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "MIT",
  "AGPL-3.0-only",
  "GPL-3.0-or-later",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
unused-license-exception = "allow"
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
# No manifest requirement in this repo uses a wildcard (`*`), and none
# ever should: a wildcard requirement delegates the version decision to
# whoever publishes next, which is exactly the trust the 2026-08-20
# arrayref attack weaponized. A wildcard entering the manifest is a
# finding, not a style note.
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Portfolio parity (2026-11-01): serde and serde_json are banned,
# matching zelynic's ruleset. The JSON lane is hand-written in
# src/bench/bench_json.rs (manual serializer, zero dependencies) and
# the derive stack is not in the graph - Cargo.lock carries zero
# serde crates.
#
# 2026-11-19 (the lock census, night-frontier-Z6): the 2026-08-20
# arrayref attack family is banned name-wide (Rust security response,
# blog.rust-lang.org/2026/08/20): proc-macro1 was a fresh payload
# crate with a build script that downloaded a second-stage payload;
# the compromised author's republishes (arrayref 0.3.10, internment
# 0.8.7, append-only-vec 0.1.9) smuggled it into trusted graphs; the
# typosquat kin (proc-macro-en, aovine, arone, aronenao, tinymember)
# harvested the rest. None of them has a legitimate route into this
# graph - the ban turns any future resolution that pulls one into a
# named, non-negotiable failure.
deny = [
    { crate = "serde", reason = "hand-written JSON lane in src/bench/bench_json.rs; the derive stack is not in the graph" },
    { crate = "serde_json", reason = "hand-written JSON parser + writer replace it" },
    { crate = "proc-macro1", reason = "2026-08-20 arrayref attack payload crate (build-script download); banned name-wide, any version" },
    { crate = "proc-macro-en", reason = "2026-08-20 arrayref attack typosquat kin; banned name-wide, any version" },
    { crate = "aovine", reason = "2026-08-20 arrayref attack typosquat kin; banned name-wide, any version" },
    { crate = "arone", reason = "2026-08-20 arrayref attack typosquat kin; banned name-wide, any version" },
    { crate = "aronenao", reason = "2026-08-20 arrayref attack typosquat kin; banned name-wide, any version" },
    { crate = "tinymember", reason = "2026-08-20 arrayref attack typosquat kin; banned name-wide, any version" },
    { crate = "arrayref", reason = "compromised-author republish 0.3.10 smuggled proc-macro1 into the graph; banned name-wide, any version" },
    { crate = "internment", reason = "compromised-author republish 0.8.7 (same author as arrayref); banned name-wide, any version" },
    { crate = "append-only-vec", reason = "compromised-author republish 0.1.9 (same author as arrayref); banned name-wide, any version" },
]
# Transitive dependency duplicates that cannot be resolved without upstream
# changes. These are caused by the dependency tree pulling in different
# major versions of the same crate through different paths:
#
# - windows-sys 0.60.2 (via notify v8) vs 0.61.2 (via ctrlc, rustix,
#   anstream, mio, etc.). Different minor versions of windows-sys —
#   notify v8 pins 0.60, the rest of the ecosystem uses 0.61.
#   Windows-only, transitive-only — it does not affect the cosmostrix
#   binary on Linux/macOS/FreeBSD at runtime. Skipping it here silences
#   the duplicate-versions warning without hiding real issues.
#
# v50.0.0-beta.7: removed mio 0.8.11 skip (notify 7 migrated to mio 1.x,
# eliminating the duplicate). Removed windows-sys 0.48.0 skip (was from
# the old mio 0.8 chain, no longer present).
#
# 2026-09-29 (notify 8 migration, NIGHT-dinner-5 follow-up): removed
# the bitflags 1.3.2 skip — notify 8 moved inotify to 0.11, which uses
# bitflags 2.x, so the bitflags 1.x duplicate is gone from the graph.
# Updated the windows-sys skip from 0.52.0 to 0.60.2 (notify 8's new
# floor).
#
# 2026-09-30 (signal-hook 0.4 migration, NIGHT-dinner-8): added the
# signal-hook 0.3.18 skip — the direct dep moved to 0.4.4 (pure pin
# bump, zero source changes), but crossterm 0.29's signal-hook-mio
# still pins the 0.3 line, so 0.3.18 stays in the graph transitively.
# The duplicate leaves only when crossterm migrates. Unix-only,
# transitive-only, and both versions route through the same
# signal-hook-registry 1.4.x backend — no duplicated signal behavior
# at runtime.
#
# 2026-09-30 (rand 0.10 migration, NIGHT-dinner-8): added the rand
# 0.9.5 and rand_core 0.9.5 skips — the direct dep moved to 0.10.3,
# but proptest 1.11.0 (the max stable line, dev-dependency only)
# still pins rand 0.9, keeping rand 0.9.5 + rand_core 0.9.5 +
# rand_chacha 0.9.0 in the dev graph. DEV-ONLY: none of it compiles
# into a cosmostrix release binary (dev-deps build for `cargo test`
# only). The duplicates leave when proptest migrates to rand 0.10.
skip = [
    { name = "windows-sys", version = "0.60.2" },
    { name = "signal-hook", version = "0.3.18" },
    { name = "rand", version = "0.9.5" },
    { name = "rand_core", version = "0.9.5" },
]
skip-tree = []

[sources]
# The graph carries zero git dependencies and zero non-crates.io
# registry sources (verified at the lock census landing, 2026-11-19).
# Unknown sources are therefore deny, not warn: an attacker who
# lands a git source or a custom registry into the resolution fails
# the gate outright instead of trading a warning for a payload.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
