[package]
name = "cosmostrix"
version = "100.0.6"
edition = "2021"
rust-version = "1.98"
authors = ["rezky_nightky (oxyzenQ)"]
description = "Professional-grade cinematic Matrix rain renderer for serious terminal environments."
license = "GPL-3.0-only"
repository = "https://github.com/oxyzenQ/cosmostrix"
# crates.io discoverability metadata. Categories are validated slugs
# from the official list (https://crates.io/categories — 58 slugs as
# of 2026-08-31, re-validated against the live registry API):
# - "command-line-utilities": the primary bucket for a terminal binary.
# - "games": "Applications for fun and entertainment" — a cinematic
#   screensaver fits.
# - "science": owner-mandated addition — the project's engineering
#   posture (OKLab color science, statistics-grade HUD/benchmarks,
#   LTS audits) earns it.
# - "rendering": maps the owner's "cinematic"/"masterpiece" intent —
#   neither is a valid registry slug (checked against the live list),
#   and "rendering" is the closest official bucket for a cinematic
#   renderer (the description already calls cosmostrix one).
# Registry limit is 5 categories; 4 used.
keywords = ["matrix", "matrix-rain", "terminal", "screensaver", "cli"]
categories = [
    "command-line-utilities",
    "games",
    "science",
    "rendering",
]
build = "build.rs"
exclude = [
    "benchmark/*",
    "docs/research/*",
    "docs/archive/*",
    "docs/audits/*",
    "assets/*.gif",
    "assets/*.png",
    "scripts/*",
    "aur/*",
    ".github/*",
    ".git/*",
    # Repo-local build/lint configuration is dead weight downstream:
    # .cargo/config.toml only applies to this repository's invocations,
    # and the lint dotfiles (.codespellrc/.yamllint/.markdownlint.yaml)
    # only matter to contributors. Not part of the shipped crate.
    ".cargo/*",
    ".codespellrc",
    ".yamllint",
    ".markdownlint.yaml",
    # dst.
]

[dependencies]
# clap: floor 4.5, ceiling one minor line ahead (4.6.x allowed since
# NIGHT-dinner-5 — the earlier `<4.6` pin blocked semver-compatible
# minor updates for no stability gain; clap 4.x has no API removals
# across minor lines and the derive surface used here is stable). The
# ceiling stays at `<4.7` so a hypothetical clap 5 (or a 4.7 with
# breaking-ish behavior) still cannot enter the lockfile silently.
clap = { version = ">=4.5, <4.7", default-features = false, features = ["std", "color", "help", "usage", "error-context", "derive", "suggestions"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
# rand: floor 0.10 (migrated from "0.9" in NIGHT-dinner-8, 2026-09-30,
# owner-approved relax policy). The 0.10 line's engine-relevant facts,
# each verified rather than assumed:
#   - API: rand_core 0.10 renamed RngCore -> Rng, so rand's extension
#     trait moved `Rng` -> `RngExt` (the ONLY source change this
#     migration needed: 2 import lines). `distr::{Distribution,
#     Uniform}` (Result-returning new/new_inclusive), `rngs::StdRng`,
#     `SeedableRng::seed_from_u64`, `rand::rng()` are unchanged.
#   - Determinism: 0.10 swapped StdRng's backend rand_chacha -> chacha20
#     "output remains the same" (their claim) — proven here with a
#     16,000-draw parity probe across 8 engine patterns (u8/u16/u32/
#     usize/i64/f32/f64, new + new_inclusive, both sample call
#     directions, multiple seeds): bit-for-bit identical vs 0.9.5.
#     Same seeds -> same sequences -> same picture.
#   - ThreadRng (rand::rng(), 2 ambient-jitter sites) is OS-seeded and
#     non-deterministic on every version; sequence identity there is
#     not a visual-identity concern.
# The bare "0.10" pin means >=0.10, <0.11 — a future 0.11 line (0.x
# minors are majors under this project's policy) cannot enter the
# lockfile silently.
rand = "0.10"
bitvec = "1"
smallvec = "1"
unicode-width = "0.2"
# chrono dropped (Hinnant-style). Was: `chrono = { version = ">=0.4.38, <0.5", default-features = false, features = ["clock"] }`.
# The `clock` feature dragged in 8 transitive crates (wasm-bindgen, js-sys,
# iana-time-zone-haiku, core-foundation-sys, etc.) for 2 production call sites
# that only needed `[HH:MM]` log stamps and a local-hour fraction. Replaced by
# direct `libc::localtime_r` / `libc::gmtime_r` calls in the `src/clock`
# module (the historical `local_secs_since_midnight` helper now lives in
# `src/central_control_power_dragon/phase_predictor.rs`).
# notify: floor 8, ceiling one major line ahead. Migrated from the
# `>=7, <8` pin in NIGHT-dinner-5 follow-up (2026-09-29, owner-approved
# relax policy): notify 8 moves notify-types to 2.x, which drops the
# unmaintained `instant` crate (RUSTSEC-2024-0384) — the deny.toml
# advisory ignore is retired with it — and moves inotify to 0.11,
# eliminating the bitflags 1.x duplicate from the Linux graph (notify 8
# also drops the filetime dep entirely). The watcher API surface this
# project uses (RecommendedWatcher::new, Config::default, the
# Event{kind,paths,attrs} literal, EventKind::Modify/Create/Remove
# matching) is identical across the 7->8 boundary: verified by
# `cargo check --locked --all-targets` and clippy -D warnings with ZERO
# source changes. The ceiling stays at `<9` so the 9.x line (currently
# 9.0.0-rc, never a lockfile candidate) cannot enter silently.
notify = { version = ">=8, <9", default-features = false }

# SHA-512 for config.toml content hashing (live-reload change
# detection, --dump-config fingerprint, --testconf fingerprint).
# Owner contract requires cryptographic hash strength rather
# than the previous FNV-1a 64-bit hash. sha2 is pure-Rust, no unsafe, and
# ~50KB compiled. Upgraded from SHA-256 to SHA-512 for higher
# security margin (256-bit collision resistance) at negligible cost
# for small config files (<5 KB). Used by:
#   - live_config_poll::hash_file_prefix (change detection)
#   - configfile::sha512_hex (dump-config + testconf fingerprinting)
# 0.11 line (2026-03): digest 0.11 / hybrid-array replaces the
# digest 0.10 / crypto-common / generic-array stack, retiring the
# upstream exact-pin and unifying cpufeatures with rand's 0.3.x.
# Only visible change: the digest output lost its LowerHex impl, so
# sha512_hex hex-encodes [u8; 64] by hand (bit-identical output,
# proven by the NIGHT_DINNER_9 parity probe).
sha2 = "0.11"

# Bug 1 fix: enable kqueue backend on FreeBSD/GhostBSD/macOS (iOS too).
# Without these target-specific features, notify's RecommendedWatcher
# falls back to a no-op backend on BSDs, silently breaking live reload.
# `macos_fsevent` is also kept for macOS to preserve the existing behavior
# (FSEvents is more efficient than kqueue on macOS).
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = ">=8, <9", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly", target_os = "ios"))'.dependencies]
notify = { version = ">=8, <9", default-features = false, features = ["kqueue"] }

[target.'cfg(unix)'.dependencies]
# signal-hook: floor 0.4 (migrated from "0.3" in NIGHT-dinner-8, 2026-09-30,
# owner-approved relax policy). The 0.4 line's only breaking change is
# low_level::pipe taking OwnedFd instead of IntoRawFd (signal-hook#196) —
# a call site this project does not have. The used surface (consts,
# iterator::Signals::new/.forever, low_level::raise, flag::register) is
# API-identical across the 0.3 -> 0.4 boundary: verified by
# `cargo check --locked --all-targets` and clippy -D warnings with ZERO
# source changes. The bare "0.4" pin means >=0.4, <0.5, so a future 0.5
# line (0.x minors are majors under this project's policy) cannot enter
# the lockfile silently.
signal-hook = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.4"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

# NIGHT-perf-1 (2026-09-20): the test profile inherits dev, so the full
# suite (about 2950 tests, 69k lines of test code compiled into the bin
# target's cfg(test) harness) used to execute at opt-level = 0 — the
# CPU-heavy simulation tests (engine invariant sweeps, black-hole spin
# math, benchmark statistics) ran 10-30x slower than optimized code.
# Level 1 costs ~20-30% more test-compile time and buys it back many
# times over in runtime; debug info and incremental compilation stay
# inherited from dev, so backtraces and rebuild speed are unchanged.
# The dev profile itself (cargo run / cargo build) is untouched.
[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = false
incremental = false

[profile.pro]
inherits = "release"
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = false
incremental = false

# pro-native: same as pro but outputs to target/pro-native/ (owner request).
# The alias in .cargo/config.toml uses --profile pro-native so the binary
# lands in target/pro-native/cosmostrix instead of target/pro/cosmostrix.
[profile.pro-native]
inherits = "pro"

# NIGHT-blade-1: profile names mirror the cargo aliases 1:1 (see
# .cargo/config.toml) — the name carries arch + baseline + libc.
[profile.pro-linux-amd64-v3-gnu]
inherits = "pro"

[profile.pro-linux-amd64-v4-gnu]
inherits = "pro"

[profile.pro-linux-amd64-v3-musl]
inherits = "pro"

[profile.pro-linux-amd64-v4-musl]
inherits = "pro"

[profile.pro-macos-aarch64-native]
inherits = "pro"

[profile.pro-win-amd64]
inherits = "pro"

[profile.pro-win-aarch64]
inherits = "pro"

[profile.pro-android-aarch64]
inherits = "pro"

[profile.pro-freebsd-amd64]
inherits = "pro"

# v18: PGO (Profile-Guided Optimization) nitro build.
# Two-stage: instrument → run benchmark → recompile with profile data.
# Use: ./scripts/build/build.sh pgo
# Or manually:
#   1. COSMOSTRIX_BUILD=nitro cargo build --profile pgo-instrument
#   2. ./target/debug/cosmostrix --benchmark --bench-duration 10
#   3. COSMOSTRIX_BUILD=nitro COSMOSTRIX_LTO=fat cargo build --profile pgo-use
[profile.pgo-instrument]
inherits = "pro"
debug = false
strip = false
# Instrumentation flags set via RUSTFLAGS in build.sh
incremental = false

[profile.pgo-use]
inherits = "pro"
debug = false
strip = true
# Profile-use flag set via RUSTFLAGS in build.sh
incremental = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

# ── Lint policy ────────────────────────────────────────────────────────
#
# Project-wide lint configuration. The actual enforcement happens in
# scripts/build/build.sh::run_clippy via `cargo clippy -- -D warnings`
# (warnings are errors). This table centralizes project-wide allows
# that would otherwise need a file-level `#![allow(...)]` attr.
#
# File-level `#![allow(...)]` attrs that remain in the source tree:
#
#   - `#![cfg_attr(not(test), allow(dead_code))]` in cloud/monolith_tests.rs
#     (Dragon Hunt v2 Phase 2 surgical marker for a test-only API surface
#     that is deliberately kept but not yet wired into the production
#     render path). A global `[lints]` setting cannot replace it —
#     `dead_code = "deny"` would break the build, `dead_code = "allow"`
#     would silence ALL dead code and undo Phase 2's triage. Leave it
#     file-local. The 6 atmosphere_*.rs markers from DHv2 Phase 2 were
#     removed when those files were deleted in commit 07b44b5.

[lints.clippy]
# Project-wide clippy lint configuration. The default clippy policy (all
# lints warn) is enforced via `cargo clippy -- -D warnings` in
# scripts/build/build.sh. Entries below are deliberate deviations:
#   - `allow` entries silence default nits project-wide.
#   - `deny` entries promote specific lints so they fail EVERY cargo
#     invocation (plain `cargo clippy`, IDE runs, rust-analyzer) —
#     not just under build.sh's -D warnings flag.
#
# excessive_precision: was previously a file-local
# `#![allow(clippy::excessive_precision)]` in src/chroma/gradient.rs.
# Moved to project-wide because the high-precision floats are
# intentional for color math throughout the chroma module, and
# verification showed no other file triggers this lint — so the
# project-wide allow is equivalent in effect to the file-local one.
excessive_precision = "allow"

# manual_slice_fill: added in Rust 1.98.0. Flags manual
# `for x in &mut slice { *x = val; }` loops that should be
# `slice.fill(val)` (stable since 1.50, identical codegen). Fired
# once during the 1.98.0 toolchain bump (terminal/tier2.rs ring
# buffer reset — fixed in commit 80d82fa). Promoted to deny per
# owner approval so every future occurrence fails any clippy run,
# not just the build.sh gate.
manual_slice_fill = "deny"

[dev-dependencies]
proptest = { version = "1.8.0", default-features = false, features = ["std"] }


# Platform-specific optimizations
# At .cargo/config.toml
