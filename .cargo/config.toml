# Custom build

# v50.0.0-beta.7 LTS audit: rust-lld is used here for aarch64-musl because
# musl static linking does not need system shared libraries (libgcc_s,
# librt, libpthread, etc.). A glibc (gnu) target cannot use rust-lld
# directly because rust-lld is a pure linker — it does not know how
# to find the host's glibc shared libraries. Using rust-lld on gnu
# targets requires `clang` as the linker driver with `-fuse-ld=lld`,
# which adds a clang dependency. See
# docs/archive/audits/LTS_BUILD_AUDIT_v50.0.0-beta.7.md §2.2 Finding A1 for the
# full recommendation and the trade-off matrix.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# v50.0.0-beta.7 LTS audit: bump cargo net retry from the default 2 to 5
# for CI stability. crates.io fetches can fail transiently on shared
# CI runners; the extra retries with cargo's built-in backoff eliminate
# the most common CI flake mode. Zero risk for local builds.
[net]
retry = 5

[alias]
# night-dragon-maintenance-T1 (the estate-wide build-label contract,
# the zelynic law): every local alias build stamps its ALIAS NAME under
# the `local-` marker ("local-pro-native-musl"), so `cosmostrix -V`
# names the exact alias that produced the binary. The `pro-` prefix
# inside the label is the estate branding rule ("every build shape
# starts with pro-") applied to the label itself, not a second marker;
# release binaries stamp the bare alias name ("pro-linux-amd64-v3-musl")
# via the release workflow, and a plain `cargo build --release` (no
# alias) infers the host shape under the same `local-` marker in
# build.rs. Pro-native was split into the libc pair below — the old
# bare `pro-native` name hid which libc the binary links against.
pro-native-musl = [
  "build",
  "--profile",
  "pro-native-musl",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-native-musl\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-native-musl\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]

# aarch64 hosts: the musl half of the pair is x86_64-only because cargo
# aliases cannot detect the host arch (the zelynic T1 note) - on an
# aarch64 Linux host use the plain release build or mirror this block
# with the aarch64-unknown-linux-musl target triple.
# The gnu half of the pro-native pair: host-default target (the host
# triple, glibc on ordinary desktop/server distros), native CPU tuning,
# no cross-compilation. The Linux x86_64 RELEASE shapes stay the fully
# static musl pair (night-dragon-maintenance-6 unchanged) — this lane
# exists for local development and desktop usage on glibc hosts where
# the musl target is not installed.
pro-native-gnu = [
  "build",
  "--profile",
  "pro-native-gnu",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-native-gnu\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-native-gnu\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\"]",
]

# NIGHT-blade-1 (zelynic pro-linux lineage): the Linux x86_64 alias
# names carry the arch (amd64), the microarch baseline (v3/v4), and
# the libc flavor, so an invocation names the exact artifact it
# produces — the old pro-linux-v3 / pro-linux-musl names hid the arch
# and the libc (musl is v3-baseline, matching its target-cpu pin).
# night-dragon-maintenance-6 (the sibling's night-badass-1 law): the
# Linux x86_64 release shapes are the fully static musl pair (v3-musl
# and v4-musl), and both ship in the release matrix. Profile names stay
# 1:1 with the alias names so the binaries land in
# target/<target>/<alias-name>/cosmostrix.
pro-linux-amd64-v3-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v3-musl",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-linux-amd64-v3-musl\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-linux-amd64-v3-musl\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v3\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
pro-linux-amd64-v4-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v4-musl",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-linux-amd64-v4-musl\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-linux-amd64-v4-musl\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64-v4\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]

# The floor-lane shape (NOT a release shape - nothing in the release
# matrix builds it): baseline x86-64 (SSE2) static musl, deliberately
# carrying no target-cpu pin. The kernel-floor lane boots the REAL
# 2.6.27 floor kernel, and a v3-baked binary cannot execute there:
# kernels older than 2.6.35 never enable YMM state in XCR0, so the
# first VEX-encoded instruction raises #UD (SIGILL) even under KVM
# host-passthrough on an AVX2 CPU. The docs' kernel floor (2.6.27)
# pairs with the docs' CPU minimum (x86-64-v1); this alias is exactly
# that pairing. This alias is NOT deprecated: the kernel-floor lane
# (.github/workflows/supermassive-kernel.yml) builds through it by name
# and the floor docs pair it with the 2.6.27 kernel minimum. Profile
# mirror: [profile.pro-linux-amd64-baseline-musl] in Cargo.toml.
pro-linux-amd64-baseline-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-baseline-musl",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-linux-amd64-baseline-musl\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-linux-amd64-baseline-musl\"",
  "--target",
  "x86_64-unknown-linux-musl",
]

pro-macos-aarch64 = [
  "build",
  "--profile",
  "pro-macos-aarch64",
  "--target",
  "aarch64-apple-darwin",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-macos-aarch64\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-macos-aarch64\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\"]",
]

pro-win-amd64 = [
  "build",
  "--profile",
  "pro-win-amd64",
  "--target",
  "x86_64-pc-windows-msvc",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-win-amd64\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-win-amd64\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=x86-64\"]",
]

pro-win-aarch64 = [
  "build",
  "--profile",
  "pro-win-aarch64",
  "--target",
  "aarch64-pc-windows-msvc",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-win-aarch64\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-win-aarch64\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\"]",
]

pro-freebsd-amd64 = [
  "build",
  "--profile",
  "pro-freebsd-amd64",
  "--config",
  "env.COSMOSTRIX_BUILD=\"local-pro-freebsd-amd64\"",
  "--config",
  "env.COSMOSTRIX_PROFILE=\"pro-freebsd-amd64\"",
  "--config",
  "build.rustflags=[\"-C\",\"target-cpu=native\"]",
  "--target",
  "x86_64-unknown-freebsd",
