# Default toolchain: pinned to 1.98.0 (with rustfmt + clippy).
#
# Dormant mode: pinned to a specific version instead of "stable" so that
# a future `stable` release cannot silently break the build. When updating
# to a newer Rust version, bump this channel + the MSRV in Cargo.toml +
# run the full gatekeeper (./scripts/build.sh check-all) to verify.
#
# Miri (UB detector) requires nightly + the `miri` component, which is
# NOT pinned here to avoid forcing nightly on every contributor. Instead,
# `./scripts/build.sh miri` auto-installs nightly + miri on first use via
# `rustup toolchain install nightly --profile minimal --component miri`.
# After Miri runs successfully, a status banner is shown on every
# subsequent `./scripts/build.sh` invocation (cached in target/miri-stamp).
# See docs/archive/audits/UNSAFE_SOUNDNESS_AUDIT.md for the audit methodology.

[toolchain]
channel = "1.98.0"
# `minimal` is LTS-correct: ships only rustc + cargo + rust-std + the
# explicitly-listed components (rustfmt + clippy). Skips rust-docs
# (~150-250 MB HTML, available online at doc.rust-lang.org) and
# rust-src (modern rust-analyzer ships its own copy via the rust-src
# rustup component, so this is no longer a hard IDE requirement).
#
# For IDE features on dev workstations: `rustup component add rust-src rust-docs`
# (or `rustup toolchain install 1.98.0 --profile default` for the full set).
# CI/release paths must NOT add these — they bloat the toolchain ~250 MB
# with no build-time benefit.
profile = "minimal"
components = ["rustfmt", "clippy"]
